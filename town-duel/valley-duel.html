<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
:root{
  color-scheme: dark;
  --ground:#16101c; --glass:rgba(20,14,26,.72); --line:rgba(239,230,214,.14); --line-2:rgba(239,230,214,.3);
  --ink:#f3ead9; --ink-2:#c7b8c3; --ink-3:#95859a; --copper:#e0703a;
  --p1:#ff3d9a; --p2:#3fc6ff; --hp-lo:#ffb03a; --boost:#e9dcc4;
  --display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.fighter{display:flex;flex-direction:column;gap:5px;min-width:0}
.fighter.right{align-items:flex-end;text-align:right}
.nameRow{display:flex;align-items:baseline;gap:10px}
.right .nameRow{flex-direction:row-reverse}
.name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.p1 .name{color:var(--p1)} .p2 .name{color:var(--p2)}
.style{font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.pips{display:flex;gap:5px}
.pip{width:10px;height:10px;border:1px solid var(--line-2);transform:rotate(45deg)}
.p1 .pip.on{background:var(--p1);border-color:var(--p1)} .p2 .pip.on{background:var(--p2);border-color:var(--p2)}
.bar{position:relative;width:min(420px,100%);height:16px;background:rgba(0,0,0,.5);border:1px solid var(--line-2);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.right .bar{clip-path:polygon(0 0,100% 0,100% 100%,10px 100%)}
.bar .fill{position:absolute;inset:0;transform-origin:left;transition:transform .12s linear}
.right .bar .fill{transform-origin:right}
.bar .lag{position:absolute;inset:0;background:rgba(243,234,217,.55);transform-origin:left;transition:transform .6s ease-out .25s}
.right .bar .lag{transform-origin:right}
.p1 .hp .fill{background:linear-gradient(90deg,#b8246c,var(--p1))} .p2 .hp .fill{background:linear-gradient(270deg,#1f7fb0,var(--p2))}
.hp.low .fill{background:var(--hp-lo)!important}
.bar.boost{height:6px;width:min(300px,75%);clip-path:none}
.boost .fill{background:var(--boost)}
.boost.empty .fill{background:var(--copper)}
.hpNum{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.center{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:2px}
.timer{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.round{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--copper);text-transform:uppercase}
.town{font-family:var(--mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(40px,9vw,96px);line-height:1;text-shadow:0 0 30px rgba(0,0,0,.65)}
.banner small{display:block;font-family:var(--mono);font-weight:500;font-size:clamp(12px,1.6vw,16px);letter-spacing:.2em;color:var(--ink-2);margin-top:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;pointer-events:none}
.feed{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0;max-width:min(470px,100%)}
.feed div{background:var(--glass);border-left:3px solid var(--line-2);padding:3px 8px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .e1{border-left-color:var(--p1)} .feed .e2{border-left-color:var(--p2)}
.feed b{color:var(--ink);font-weight:600}
.controls{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;background:var(--glass);padding:6px;border:1px solid var(--line)}
.btn{font:500 13px/1 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line-2);padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
.btn[aria-pressed="true"]{background:rgba(243,234,217,.14);border-color:var(--ink)}
.hint{font-size:12px;color:var(--ink-3);align-self:center;padding:0 6px}
@media (max-width:640px){.hint{display:none}}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
@media (max-width:640px){
  .hud{grid-template-columns:1fr 1fr;row-gap:6px}
  .center{grid-column:1/-1;grid-row:1}
  .timer{font-size:30px}
  .name{font-size:17px}
  .style{display:none}
  .feed{display:none}
}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {Sky} from 'three/addons/objects/Sky.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
const {createTerrain, buildTile, flatPointAt, gridIndex, bakeSunVisibility, DEFAULT_TERRAIN}=(()=>{
// Terrain generator — pure JS, no dependencies, safe to run in a Web Worker.
//
// Height is a function of a 3D point and its local "up" direction, so the same code drives
// a flat test tile now (up = +Y) and quad-sphere planet tiles later (up = normalize(p)).
// Everything is seeded and deterministic: a tile rebuilt from the same address is identical.
//
// Layers:
//   1. region mask   — where mountain ranges vs. flat valley floors are
//   2. domain warp   — bends ridgelines so they branch instead of lining up on a grid
//   3. ridged multifractal with derivative damping — sharp crests, eroded-looking flanks
//   4. gully filter  — slope-aligned channels running downhill (triplanar, seamless on a sphere)
//   5. droplet erosion (optional, per grid) — hydraulic carving + sediment fans
//
// Units are arbitrary; the lab uses kilometres.

const DEFAULT_TERRAIN = {
  seed: 7,
  mountainHeight: 1.35,   // peak height above the valley floor
  valleyHeight: 0.05,     // relief of the flat areas
  coverage: 0.52,         // 0..1, how much of the land is mountains
  maskScale: 0.11,        // frequency of the mountain/valley regions
  ridgeScale: 0.32,       // base frequency of the ridges
  octaves: 9,
  sharpness: 2.1,         // ridge crest sharpness (1 = rounded, 3 = knife edges)
  ridgeGain: 1.9,         // how much detail follows existing ridges
  erosionDamping: 0.55,   // derivative damping: smooth slopes, detail stays on crests and flats
  warp: 0.75,             // domain warp amount
  warpScale: 0.18,
  gullyStrength: 0.9,     // slope-aligned channel depth
  gullyScale: 3.2,        // channel frequency
  gullySlope: 3.0,        // how strongly slope steers the channels
  gullyOctaves: 5,
  pads: null,             // [{x,y,z,r,fall,h,rough}] flattened settlement areas (same units)
  continents: null,       // {scale, coast, depth, uplift}: oceans + land masses (planet); off for single tiles
};

// ---------------------------------------------------------------- noise
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function makeNoise(seed){
  const r=mulberry(seed*9973+17), perm=new Uint8Array(512), val=new Float32Array(256);
  for(let i=0;i<256;i++){ perm[i]=i; val[i]=r()*2-1; }
  for(let i=255;i>0;i--){ const j=(r()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<256;i++) perm[i+256]=perm[i];
  const H=(x,y,z)=>val[perm[perm[perm[x&255]+(y&255)]+(z&255)]];

  // value noise with analytic derivatives (quintic). out = [value, dx, dy, dz], value in ~[-1,1]
  function noised(x,y,z,out){
    const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z), fx=x-ix, fy=y-iy, fz=z-iz;
    const ux=fx*fx*fx*(fx*(fx*6-15)+10), uy=fy*fy*fy*(fy*(fy*6-15)+10), uz=fz*fz*fz*(fz*(fz*6-15)+10);
    const dux=30*fx*fx*(fx*(fx-2)+1), duy=30*fy*fy*(fy*(fy-2)+1), duz=30*fz*fz*(fz*(fz-2)+1);
    const a=H(ix,iy,iz), b=H(ix+1,iy,iz), c=H(ix,iy+1,iz), d=H(ix+1,iy+1,iz);
    const e=H(ix,iy,iz+1), f=H(ix+1,iy,iz+1), g=H(ix,iy+1,iz+1), h=H(ix+1,iy+1,iz+1);
    const k1=b-a, k2=c-a, k3=e-a, k4=a-b-c+d, k5=a-c-e+g, k6=a-b-e+f, k7=-a+b+c-d+e-f-g+h;
    out[0]=a+k1*ux+k2*uy+k3*uz+k4*ux*uy+k5*uy*uz+k6*uz*ux+k7*ux*uy*uz;
    out[1]=dux*(k1+k4*uy+k6*uz+k7*uy*uz);
    out[2]=duy*(k2+k5*uz+k4*ux+k7*uz*ux);
    out[3]=duz*(k3+k6*ux+k5*uy+k7*ux*uy);
    return out;
  }
  // 2D cell hash for the gully filter
  const hash2=(x,y,o)=>{ const i=perm[perm[x&255]+(y&255)]; o[0]=val[i]*0.5+0.5; o[1]=val[perm[i+37]]*0.5+0.5; return o; };
  return {noised,hash2};
}

// octave rotation (breaks grid alignment between octaves)
const RM=[0.00,0.80,0.60, -0.80,0.36,-0.48, -0.60,-0.48,0.64];

// ---------------------------------------------------------------- terrain
function createTerrain(opts={}){
  const P={...DEFAULT_TERRAIN,...opts};
  const N=makeNoise(P.seed), nd=[0,0,0,0], hc=[0,0];

  // fbm value + world-space gradient. out=[v,gx,gy,gz]
  function fbm(x,y,z,freq,oct,out){
    let m0=freq,m1=0,m2=0,m3=0,m4=freq,m5=0,m6=0,m7=0,m8=freq;   // accumulated matrix M (q = M p)
    let v=0,gx=0,gy=0,gz=0,a=0.5,norm=0;
    for(let i=0;i<oct;i++){
      N.noised(m0*x+m1*y+m2*z, m3*x+m4*y+m5*z, m6*x+m7*y+m8*z, nd);
      v+=a*nd[0]; norm+=a;
      gx+=a*(m0*nd[1]+m3*nd[2]+m6*nd[3]); gy+=a*(m1*nd[1]+m4*nd[2]+m7*nd[3]); gz+=a*(m2*nd[1]+m5*nd[2]+m8*nd[3]);
      const n0=2*(RM[0]*m0+RM[1]*m3+RM[2]*m6), n1=2*(RM[0]*m1+RM[1]*m4+RM[2]*m7), n2=2*(RM[0]*m2+RM[1]*m5+RM[2]*m8);
      const n3=2*(RM[3]*m0+RM[4]*m3+RM[5]*m6), n4=2*(RM[3]*m1+RM[4]*m4+RM[5]*m7), n5=2*(RM[3]*m2+RM[4]*m5+RM[5]*m8);
      const n6=2*(RM[6]*m0+RM[7]*m3+RM[8]*m6), n7=2*(RM[6]*m1+RM[7]*m4+RM[8]*m7), n8=2*(RM[6]*m2+RM[7]*m5+RM[8]*m8);
      m0=n0;m1=n1;m2=n2;m3=n3;m4=n4;m5=n5;m6=n6;m7=n7;m8=n8; a*=0.5;
    }
    out[0]=v/norm; out[1]=gx/norm; out[2]=gy/norm; out[3]=gz/norm; return out;
  }

  // ridged multifractal with derivative damping. returns [h 0..~1, gx, gy, gz]
  function ridged(x,y,z,out){
    let m0=P.ridgeScale,m1=0,m2=0,m3=0,m4=P.ridgeScale,m5=0,m6=0,m7=0,m8=P.ridgeScale;
    let sum=0,a=1,w=1,dx=0,dy=0,dz=0,gx=0,gy=0,gz=0,norm=0;
    for(let i=0;i<P.octaves;i++){
      N.noised(m0*x+m1*y+m2*z, m3*x+m4*y+m5*z, m6*x+m7*y+m8*z, nd);
      const wx=m0*nd[1]+m3*nd[2]+m6*nd[3], wy=m1*nd[1]+m4*nd[2]+m7*nd[3], wz=m2*nd[1]+m5*nd[2]+m8*nd[3];
      const s=nd[0]<0?-1:1, r0=1-Math.abs(nd[0]), r=Math.pow(Math.max(r0,0),P.sharpness);
      const k=-s*P.sharpness*Math.pow(Math.max(r0,1e-4),P.sharpness-1);   // d(ridge)/d(noise)
      const rx=k*wx, ry=k*wy, rz=k*wz;
      // damping: detail is suppressed where the accumulated slope is steep (flanks stay clean, crests stay busy)
      const damp=1/(1+P.erosionDamping*(dx*dx+dy*dy+dz*dz));
      const c=a*w*r*damp; sum+=c; norm+=a;
      gx+=a*w*damp*rx; gy+=a*w*damp*ry; gz+=a*w*damp*rz;
      dx+=a*rx*w; dy+=a*ry*w; dz+=a*rz*w;
      w=Math.min(1,Math.max(0,r*P.ridgeGain));
      const n0=2*(RM[0]*m0+RM[1]*m3+RM[2]*m6), n1=2*(RM[0]*m1+RM[1]*m4+RM[2]*m7), n2=2*(RM[0]*m2+RM[1]*m5+RM[2]*m8);
      const n3=2*(RM[3]*m0+RM[4]*m3+RM[5]*m6), n4=2*(RM[3]*m1+RM[4]*m4+RM[5]*m7), n5=2*(RM[3]*m2+RM[4]*m5+RM[5]*m8);
      const n6=2*(RM[6]*m0+RM[7]*m3+RM[8]*m6), n7=2*(RM[6]*m1+RM[7]*m4+RM[8]*m7), n8=2*(RM[6]*m2+RM[7]*m5+RM[8]*m8);
      m0=n0;m1=n1;m2=n2;m3=n3;m4=n4;m5=n5;m6=n6;m7=n7;m8=n8; a*=0.5;
    }
    out[0]=sum/norm; out[1]=gx/norm; out[2]=gy/norm; out[3]=gz/norm; return out;
  }

  // gully filter (after clayjohn's "eroded terrain noise"): slope-aligned cosine stripes in a
  // jittered cell grid. (u,v) are plane coords, (ga,gb) the height gradient in that plane.
  const TAU=Math.PI*2;
  function erosionCell(u,v,dirx,diry,o){
    const iu=Math.floor(u), iv=Math.floor(v), fu=u-iu, fv=v-iv; let va=0,vb=0,vc=0,wt=0;
    for(let i=-2;i<=1;i++) for(let j=-2;j<=1;j++){
      N.hash2(iu-i,iv-j,hc); const pu=fu+i-hc[0]*0.5, pv=fv+j-hc[1]*0.5;
      const w=Math.exp(-(pu*pu+pv*pv)*2); wt+=w; const mag=(pu*dirx+pv*diry)*TAU;
      va+=Math.cos(mag)*w; const sn=-Math.sin(mag)*w; vb+=sn*dirx; vc+=sn*diry;
    }
    o[0]=va/wt; o[1]=vb/wt; o[2]=vc/wt; return o;
  }
  const eo=[0,0,0];
  function gullyPlane(u,v,ga,gb){
    let hx=0,hy=0,hz=0,a=0.5,f=1;
    const bx=gb*P.gullySlope, by=-ga*P.gullySlope;      // gradient rotated 90° → stripes run downhill
    for(let i=0;i<P.gullyOctaves;i++){
      erosionCell(u*P.gullyScale*f, v*P.gullyScale*f, bx+hz, by-hy, eo);
      hx+=eo[0]*a; hy+=eo[1]*a*f; hz+=eo[2]*a*f; a*=0.4; f*=2;
    }
    return hx;   // ~[-1,1]: negative = channel, positive = spur
  }

  const t4=[0,0,0,0], w1=[0,0,0,0], w2=[0,0,0,0], w3=[0,0,0,0], rg=[0,0,0,0], vl=[0,0,0,0];
  // Height at 3D point p with local up u. out = {h, gully, mountain}
  function sample(px,py,pz,ux,uy,uz,out){
    // 1. regions
    fbm(px+31.7,py-12.3,pz+5.1,P.maskScale,4,t4);
    const m0=t4[0]*0.5+0.5, lo=P.coverage-0.12, hi=P.coverage+0.12;
    let mt=Math.min(1,Math.max(0,(m0-(1-hi))/((1-lo)-(1-hi)))); mt=mt*mt*(3-2*mt);
    // 2. warp
    fbm(px,py,pz,P.warpScale,3,w1); fbm(px+17.1,py+3.3,pz-9.2,P.warpScale,3,w2); fbm(px-5.7,py+11.9,pz+23.4,P.warpScale,3,w3);
    const qx=px+P.warp*w1[0], qy=py+P.warp*w2[0], qz=pz+P.warp*w3[0];
    // 3. ridges (+ gentle valley floor)
    ridged(qx,qy,qz,rg); fbm(px-40,py+2,pz+11,0.9,4,vl);
    let mh=P.mountainHeight*mt; const vh=P.valleyHeight;
    let h=vh*(vl[0]*0.5+0.5)+mh*rg[0]*rg[0]*1.6;        // squaring keeps valley floors flat, lifts peaks
    const gs=mh*rg[0]*3.2, gx=gs*rg[1]+vh*0.5*vl[1], gy=gs*rg[2]+vh*0.5*vl[2], gz=gs*rg[3]+vh*0.5*vl[3];
    // 4. gullies — gradient projected onto the tangent plane, triplanar-blended by up (seamless on a sphere)
    const gd=gx*ux+gy*uy+gz*uz, tx=gx-ux*gd, ty=gy-uy*gd, tz=gz-uz*gd, slope=Math.hypot(tx,ty,tz);
    let gully=0;
    if(P.gullyStrength>0&&mh>1e-4){
      let ax=ux*ux*ux*ux, ay=uy*uy*uy*uy, az=uz*uz*uz*uz; const s=ax+ay+az; ax/=s; ay/=s; az/=s;
      if(ay>0.01) gully+=ay*gullyPlane(px,pz,tx,tz);
      if(ax>0.01) gully+=ax*gullyPlane(pz,py,tz,ty);
      if(az>0.01) gully+=az*gullyPlane(px,py,tx,ty);
      const sm=Math.min(1,slope/0.9);                 // only on slopes
      h+=gully*P.gullyStrength*0.06*mh*sm*(0.35+0.65*rg[0]);
      gully*=sm;

  camPos.y=Math.max(camPos.y,H(camPos.x,camPos.z)+0.5);
  camera.position.copy(camPos); camera.up.set(0,1,0); camera.lookAt(camTarget);
  const s=trauma*trauma, t=performance.now()/1000;
  if(s>0.0005){ const amp=0.1*D/6; camera.position.x+=amp*s*(vnoise(t*18,1)-0.5)*2; camera.position.y+=amp*s*(vnoise(t*18,7)-0.5)*2; camera.position.z+=amp*s*(vnoise(t*18,13)-0.5)*2;
    camera.rotateZ(0.04*s*(vnoise(t*15,21)-0.5)*2); }
}
function hud(){
  F.forEach((f,i)=>{ const hp=$('hp'+i); hp.querySelector('.fill').style.transform=`scaleX(${f.hp/1000})`; hp.querySelector('.lag').style.transform=`scaleX(${f.hp/1000})`; hp.classList.toggle('low',f.hp<250);
    const bo=$('bo'+i); bo.querySelector('.fill').style.transform=`scaleX(${f.boost/100})`; bo.classList.toggle('empty',f.boost<12);
    $('hpn'+i).textContent=Math.ceil(f.hp)+' HP'+(f.gun?` · Rifle ${Math.round(f.gun.energy)}%`:'')+(HELIS[i]?(HELIS[i].alive?` · Gunship ${Math.round(HELIS[i].hp/HELI_HP*100)}%`:' · Gunship down'):''); [...$('pips'+i).children].forEach((p,k)=>p.classList.toggle('on',k<f.wins)); });
  $('timer').textContent=Math.ceil(timeLeft); const pct=Math.round(destroyedProps/townTotal*100); $('town').textContent=pct?`Town ${pct}% destroyed`:'Town intact';
}

// ===================================================== loop
let last=performance.now();
function step(dt){
  if(hitStop>0){ hitStop-=dt; dt*=0.12; }
  phaseT+=dt;
  if(phase==='intro'){ if(phaseT>0.9) showBanner('Fight','Round '+round); if(phaseT>1.6){ phase='fight'; $('banner').hidden=true; F.forEach(f=>f.thinkT=rand(0,0.3)); } }
  if(phase==='fight'){ timeLeft-=dt; if(timeLeft<=0){ timeLeft=0; const [a,b]=F; endRound(a.hp===b.hp?null:(a.hp>b.hp?a:b),'Time'); } }
  if(phase==='ko'&&phaseT>4.6){ if(F.some(f=>f.wins>=2)) newMatch(); else { round++; startRound(); } }
  F.forEach(f=>update(f,dt)); separate();
  F.forEach(f=>{ f.mixer.update(dt); weaponOverride(f); headTrack(f,dt); gunCarry(f,dt); f.model.updateMatrixWorld(true); footfalls(f); damageFX(f,dt); gunFX(f,dt); }); HELIS.forEach(h=>updateHeli(h,dt)); updateHeliProjectiles(dt);
  updateBullets(dt); updateLasers(dt); updateBeams(dt); updatePickups(dt); updateDebris(dt); particlesA.update(dt); particlesN.update(dt); particlesF.update(dt);
}
function loop(now){
  { const t=now/1000; terrInnerMat.userData.uniforms.uTime.value=t; terrOuterMat.userData.uniforms.uTime.value=t; water.userData.uniforms.uTime.value=t; }
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(!paused){ const sdt=dt*speed, n=Math.ceil(sdt/0.02); for(let i=0;i<n;i++) step(sdt/n); }
  F.forEach(updateTrail); updateCamera(dt); hud(); composer.render();
}
$('pause').onclick=e=>{ paused=!paused; e.currentTarget.setAttribute('aria-pressed',paused); e.currentTarget.textContent=paused?'Resume':'Pause'; };
const SPEEDS=[1.4,2,1,0.5]; let si=0;
$('spd').onclick=e=>{ si=(si+1)%SPEEDS.length; speed=SPEEDS[si]; e.currentTarget.textContent=`Speed ${speed}×`; };
$('cam').onclick=()=>setFollow(!RTS.follow);
$('restart').onclick=()=>{ if(F.length) newMatch(); };
window.__arena={HELIS,RTS,pickups,gunCharge,gunBurst,STATS,F,get phase(){return phase},get round(){return round},step,get destroyed(){return destroyedProps},get total(){return townTotal},props,debris,G,particles:[particlesA,particlesN,particlesF]};
</script>
