<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodcutter Camp</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; background: #dfe3e6; }
  #ui { position: fixed; top: 12px; left: 12px; width: 230px; background: rgba(28,26,22,.85); color: #eee; border-radius: 8px; padding: 12px; }
  #ui h1 { font-size: 15px; margin: 0 0 2px; }
  #ui button { display: block; width: 100%; margin: 4px 0; padding: 7px; border: 0; border-radius: 5px; background: #6b7d55; color: #fff; cursor: pointer; font: inherit; }
  #ui button:hover { background: #81966a; }
  #ui button.warn { background: #9a4a2a; }
  #status { color: #e9c58f; margin: 6px 0; min-height: 1.4em; }
  #tree { max-height: 38vh; overflow: auto; font-size: 12px; border-top: 1px solid #555; padding-top: 6px; }
  #tree div { display: flex; justify-content: space-between; }
  #tree b { color: #aaa; font-weight: normal; }
  #tip { position: fixed; display: none; pointer-events: none; background: #000c; color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 12px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading camp…</div>
<div id="ui">
  <h1>Woodcutter Camp</h1>
  <div id="count"></div>
  <div id="status">Ready – click any part to knock it off</div>
  <button id="build">Construct</button>
  <button id="produce">Toggle production</button>
  <button id="damage" class="warn">Damage (3 stages)</button>
  <button id="repair">Repair</button>
  <button id="export">Export .glb</button>
  <div id="tree"></div>
</div>
<div id="tip"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
