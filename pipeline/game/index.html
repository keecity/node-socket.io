<title>Voltusk Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D arena; HUD plates pinned top-left/top-right, move callout centred,
   battle log + controls along the bottom. Single deliberate night-storm look. */
:root {
  --night: #070b16;          /* arena sky */
  --panel: rgba(10, 18, 36, 0.78);
  --line: rgba(120, 200, 255, 0.28);
  --ink: #e9f2ff;
  --muted: #8ea3c4;
  --volt: #ffe14a;           /* electric yellow */
  --arc: #66d6ff;            /* arc cyan */
  --hp-high: #47e08a;
  --hp-mid: #f6c945;
  --hp-low: #ff6b6b;
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--ui); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: fixed; inset: 0; pointer-events: none;
  display: grid; grid-template-rows: auto 1fr auto;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.plates { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.plate {
  width: min(330px, 46%); min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px; display: grid; gap: 6px;
  backdrop-filter: blur(6px);
}
.plate.right { text-align: right; }
.plate .name { font-family: var(--display); font-size: clamp(15px, 2.4vw, 22px); letter-spacing: 0.02em; line-height: 1; }
.plate.blue .name { color: var(--arc); }
.plate.gold .name { color: var(--volt); }
.meta { display: flex; gap: 8px; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.plate.right .meta, .plate.right .chips { justify-content: flex-end; }
.type { color: var(--night); background: var(--volt); padding: 0 6px; border-radius: 3px; font-weight: 700; }
.hpbar { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.08); overflow: hidden; }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--hp-high); transition: width 0.45s ease-out, background-color 0.3s; }
.plate.right .hpbar i { margin-left: auto; }
.hpnum { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 18px; }
.chip { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; }
.chip.par { color: var(--volt); }
.chip.chg { color: var(--arc); }
.chip.eva { color: var(--ink); }

.center { display: grid; place-items: start center; padding-top: 4vh; }
.turn { font-size: 12px; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
.callout {
  margin-top: 8px; font-family: var(--display); font-size: clamp(20px, 4.6vw, 44px);
  color: var(--volt); text-align: center; text-wrap: balance; max-width: 90vw;
  text-shadow: 0 0 18px rgba(255, 225, 74, 0.55), 0 2px 0 #000;
  opacity: 0; transform: translateY(6px) scale(0.96); transition: opacity 0.2s, transform 0.2s;
}
.callout.show { opacity: 1; transform: none; }
.callout small { display: block; font-family: var(--ui); font-size: 0.38em; color: var(--ink); letter-spacing: 0.12em; text-transform: uppercase; text-shadow: 0 1px 0 #000; }

.bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.log {
  min-width: 0; flex: 1 1 320px; max-width: 560px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 12px; font-size: 13px; line-height: 1.45; display: grid; gap: 2px;
}
.log p { margin: 0; color: var(--muted); }
.log p:last-child { color: var(--ink); }
.log b { color: var(--volt); font-weight: 600; }
.controls { display: flex; gap: 8px; pointer-events: auto; }
.controls button {
  font-family: var(--ui); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 12px; cursor: pointer;
}
.controls button:hover { border-color: var(--arc); color: var(--arc); }
.controls button:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
.controls button[aria-pressed="true"] { color: var(--volt); border-color: var(--volt); }

.dmg { position: fixed; font-family: var(--display); font-size: 26px; pointer-events: none; transform: translate(-50%, -50%);
  text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 2px 0 #000; will-change: transform, opacity; }
.dmg.crit { color: var(--volt); font-size: 32px; }
.dmg.miss { color: var(--ink); font-size: 20px; }
.dmg.heal { color: var(--hp-high); }
#flash { position: fixed; inset: 0; background: #fff8c4; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; gap: 8px; background: var(--night); }
#loading h1 { margin: 0; font-family: var(--display); color: var(--volt); font-size: clamp(28px, 6vw, 56px); }
#loading p { margin: 0; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; font-size: 12px; }
@media (max-width: 520px) {
  .plate { width: 48%; padding: 8px; }
  .meta { font-size: 10px; gap: 4px; }
  .log { font-size: 12px; }
  .controls button { padding: 8px 9px; font-size: 12px; }
}
</style>

<div class="hud">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Animations were solved from generated video by the creature pipeline. Event times are the
// fraction of each clip where its impact happens (measured from the solved motion).
const ASSETS = { rig: 'rig.fbx', anim: (n) => `anims/${n}.glb` };
const CLIPS = ['idle', 'walk', 'attack', 'bite', 'jump', 'dodge', 'spin'];
const EVENT = { attack: 0.42, bite: 0.36, jump: 0.62, spin: 0.62, dodge: 0.3 };
const PLAYBACK = { idle: 1, walk: 1.5, attack: 1.35, bite: 1.35, jump: 1.25, dodge: 1.6, spin: 1.2 };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- clock: everything runs on game time so Pause and 2x apply to all of it ----------
let speed = 1, paused = false, gameTime = 0;
const timers = [];
function wait(ms) { return new Promise((res) => timers.push({ at: gameTime + ms / 1000, res })); }
function tween(dur, fn) {
  return new Promise((res) => timers.push({ start: gameTime, dur, fn, res }));
}
function tickTimers() {
  for (let i = timers.length - 1; i >= 0; i--) {
    const t = timers[i];
    if (t.fn) {
      const k = Math.min(1, (gameTime - t.start) / t.dur);
      t.fn(k);
      if (k >= 1) { timers.splice(i, 1); t.res(); }
    } else if (gameTime >= t.at) { timers.splice(i, 1); t.res(); }
  }
}
const ease = (k) => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#070b16');
scene.fog = new THREE.Fog('#070b16', 9, 22);
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 80);

scene.add(new THREE.HemisphereLight('#cfe6ff', '#2a2440', 1.25));
const key = new THREE.DirectionalLight('#ffffff', 1.4); key.position.set(3, 6, 4); scene.add(key);
const back = new THREE.DirectionalLight('#9fd8ff', 0.9); back.position.set(-4, 3, -5); scene.add(back);
const rimA = new THREE.PointLight('#66d6ff', 6, 7, 2); rimA.position.set(-3.2, 2.2, -1.5); scene.add(rimA);
const rimB = new THREE.PointLight('#ffe14a', 6, 7, 2); rimB.position.set(3.2, 2.2, -1.5); scene.add(rimB);

function arenaTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(512, 512, 40, 512, 512, 512);
  grad.addColorStop(0, '#16233f'); grad.addColorStop(1, '#0a1022');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 1024);
  g.strokeStyle = 'rgba(102,214,255,0.35)'; g.lineWidth = 3;
  for (const r of [150, 300, 440, 500]) { g.beginPath(); g.arc(512, 512, r, 0, Math.PI * 2); g.stroke(); }
  g.strokeStyle = 'rgba(102,214,255,0.12)'; g.lineWidth = 2;
  for (let a = 0; a < 12; a++) {
    const t = a / 12 * Math.PI * 2;
    g.beginPath(); g.moveTo(512 + Math.cos(t) * 150, 512 + Math.sin(t) * 150); g.lineTo(512 + Math.cos(t) * 500, 512 + Math.sin(t) * 500); g.stroke();
  }
  // centre bolt sigil
  g.fillStyle = 'rgba(255,225,74,0.5)';
  g.beginPath(); g.moveTo(540, 380); g.lineTo(470, 520); g.lineTo(520, 520); g.lineTo(480, 650); g.lineTo(565, 490); g.lineTo(515, 490); g.closePath(); g.fill();
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}
const floor = new THREE.Mesh(new THREE.CircleGeometry(6.2, 96), new THREE.MeshStandardMaterial({ map: arenaTexture(), roughness: 0.85, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const rim = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.05, 8, 128), new THREE.MeshBasicMaterial({ color: '#66d6ff' }));
rim.rotation.x = Math.PI / 2; scene.add(rim);
// pylons around the ring
const pylons = [];
for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2 + Math.PI / 8;
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.14, 2.4, 8), new THREE.MeshStandardMaterial({ color: '#1a2647', emissive: i % 2 ? '#ffe14a' : '#66d6ff', emissiveIntensity: 0.35 }));
  p.position.set(Math.cos(a) * 7, 1.2, Math.sin(a) * 7); scene.add(p); pylons.push(p);
}
// drifting motes
const moteGeo = new THREE.BufferGeometry();
const moteN = 220, motePos = new Float32Array(moteN * 3);
for (let i = 0; i < moteN; i++) { motePos[i * 3] = rand(-9, 9); motePos[i * 3 + 1] = rand(0.2, 6); motePos[i * 3 + 2] = rand(-9, 9); }
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({ color: '#66d6ff', size: 0.04, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(motes);

// ---------- effects ----------
const fx = [];
let shake = 0;
const flashEl = document.getElementById('flash');
function screenFlash(strength = 0.6) {
  if (REDUCED) strength *= 0.3;
  flashEl.style.transition = 'none'; flashEl.style.opacity = strength;
  requestAnimationFrame(() => { flashEl.style.transition = 'opacity 0.35s ease-out'; flashEl.style.opacity = 0; });
}
function kick(amount) { shake = Math.max(shake, REDUCED ? amount * 0.3 : amount); }
function lightFlash(pos, color = '#ffe14a', intensity = 14, life = 0.35) {
  const l = new THREE.PointLight(color, intensity, 6, 2); l.position.copy(pos); scene.add(l);
  fx.push({ life, t: 0, update(k) { l.intensity = intensity * (1 - k); }, dispose() { scene.remove(l); } });
}
function jagged(a, b, segments, jitter) {
  const pts = [a.clone()];
  const dir = b.clone().sub(a);
  for (let i = 1; i < segments; i++) {
    const p = a.clone().addScaledVector(dir, i / segments);
    p.x += rand(-jitter, jitter); p.y += rand(-jitter, jitter); p.z += rand(-jitter, jitter);
    pts.push(p);
  }
  pts.push(b.clone());
  return pts;
}
function boltMesh(pts, radius, color, opacity) {
  const path = new THREE.CurvePath();
  for (let i = 0; i < pts.length - 1; i++) path.add(new THREE.LineCurve3(pts[i], pts[i + 1]));
  return new THREE.Mesh(new THREE.TubeGeometry(path, pts.length * 3, radius, 5, false),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
}
function bolt(from, to, { life = 0.45, jitter = 0.18, segments = 12, color = '#fff6b0', glow = '#66d6ff', width = 0.025, branches = 2 } = {}) {
  const group = new THREE.Group(); scene.add(group);
  let refresh = 0;
  function rebuild() {
    group.children.forEach((m) => { m.geometry.dispose(); m.material.dispose(); });
    group.clear();
    const pts = jagged(from(), to(), segments, jitter);
    group.add(boltMesh(pts, width, color, 1));
    group.add(boltMesh(pts, width * 4, glow, 0.35));
    for (let b = 0; b < branches; b++) {
      const s = pts[Math.floor(rand(2, pts.length - 2))];
      const end = s.clone().add(new THREE.Vector3(rand(-0.6, 0.6), rand(-0.5, 0.3), rand(-0.6, 0.6)));
      group.add(boltMesh(jagged(s, end, 5, jitter * 0.6), width * 0.6, color, 0.8));
    }
  }
  rebuild();
  fx.push({ life, t: 0, update(k, dt) {
    refresh -= dt; if (refresh <= 0) { rebuild(); refresh = 0.05; }
    group.children.forEach((m) => { m.material.opacity *= k > 0.6 ? 0.9 : 1; });
  }, dispose() { group.children.forEach((m) => { m.geometry.dispose(); m.material.dispose(); }); scene.remove(group); } });
}
function sparks(pos, { count = 60, color = '#ffe14a', speed = 3.2, life = 0.8, up = 1.5 } = {}) {
  const geo = new THREE.BufferGeometry();
  const p = new Float32Array(count * 3), v = [];
  for (let i = 0; i < count; i++) {
    p.set([pos.x, pos.y, pos.z], i * 3);
    const d = new THREE.Vector3(rand(-1, 1), rand(-0.2, 1) * up, rand(-1, 1)).normalize().multiplyScalar(rand(0.4, 1) * speed);
    v.push(d);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const mat = new THREE.PointsMaterial({ color, size: 0.09, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const pts = new THREE.Points(geo, mat); scene.add(pts);
  fx.push({ life, t: 0, update(k, dt) {
    for (let i = 0; i < count; i++) {
      v[i].y -= 6 * dt;
      p[i * 3] += v[i].x * dt; p[i * 3 + 1] = Math.max(0.02, p[i * 3 + 1] + v[i].y * dt); p[i * 3 + 2] += v[i].z * dt;
    }
    geo.attributes.position.needsUpdate = true; mat.opacity = 1 - k;
  }, dispose() { geo.dispose(); mat.dispose(); scene.remove(pts); } });
}
function shockwave(pos, { radius = 3, life = 0.6, color = '#66d6ff' } = {}) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 64), new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(pos.x, 0.04, pos.z); scene.add(ring);
  fx.push({ life, t: 0, update(k) { const s = 0.2 + k * radius; ring.scale.set(s, s, s); ring.material.opacity = 1 - k; },
    dispose() { ring.geometry.dispose(); ring.material.dispose(); scene.remove(ring); } });
}
function skyStrike(pos, life = 0.5) {
  const top = () => new THREE.Vector3(pos.x + rand(-0.3, 0.3), 9, pos.z + rand(-0.3, 0.3));
  bolt(top, () => pos.clone(), { life, jitter: 0.35, segments: 18, width: 0.05, branches: 4 });
  lightFlash(pos.clone().setY(1.5), '#fff6b0', 22, life);
}
function runFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt; const k = Math.min(1, f.t / f.life);
    f.update(k, dt);
    if (k >= 1) { f.dispose(); fx.splice(i, 1); }
  }
}
function popText(worldPos, text, cls) {
  const el = document.createElement('div'); el.className = 'dmg ' + (cls || ''); el.textContent = text;
  document.body.appendChild(el);
  const start = worldPos.clone();
  fx.push({ life: 1.1, t: 0, update(k) {
    const p = start.clone(); p.y += k * 0.8; p.project(camera);
    el.style.left = ((p.x + 1) / 2 * innerWidth) + 'px';
    el.style.top = ((1 - p.y) / 2 * innerHeight) + 'px';
    el.style.opacity = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    el.style.transform = `translate(-50%,-50%) scale(${k < 0.15 ? 0.6 + k * 2.7 : 1})`;
  }, dispose() { el.remove(); } });
}

// ---------- monsters ----------
const MOVES = {
  horn:   { name: 'Thunder Horn', anim: 'attack', power: 24, acc: 95, melee: true, line: 'drives a crackling horn forward' },
  fang:   { name: 'Volt Fang',    anim: 'bite',   power: 20, acc: 100, melee: true, par: 0.3, line: 'sinks in electrified fangs' },
  leap:   { name: 'Static Leap',  anim: 'jump',   power: 26, acc: 85, line: 'leaps and slams a shockwave across the arena' },
  spin:   { name: 'Storm Spin',   anim: 'spin',   power: 34, acc: 80, melee: true, recoil: 0.1, line: 'spins through the air and crashes down' },
  step:   { name: 'Spark Step',   anim: 'dodge',  self: true, line: 'flickers out of reach' },
  charge: { name: 'Overcharge',   anim: 'idle',   self: true, line: 'calls lightning down onto itself' },
};
// Rotate the texture's hue in the shader so a variant keeps its shading but swaps colours.
function hueShift(material, degrees) {
  const a = degrees * Math.PI / 180;
  material.onBeforeCompile = (shader) => {
    shader.uniforms.hueAngle = { value: a };
    shader.fragmentShader = 'uniform float hueAngle;\n' + shader.fragmentShader.replace('#include <map_fragment>', `
      #include <map_fragment>
      {
        const mat3 toYIQ = mat3(0.299, 0.596, 0.211, 0.587, -0.274, -0.523, 0.114, -0.322, 0.312);
        const mat3 toRGB = mat3(1.0, 1.0, 1.0, 0.956, -0.272, -1.106, 0.621, -0.647, 1.703);
        vec3 yiq = toYIQ * diffuseColor.rgb;
        float c = cos(hueAngle), s = sin(hueAngle);
        yiq.yz = vec2(yiq.y * c - yiq.z * s, yiq.y * s + yiq.z * c);
        diffuseColor.rgb = clamp(toRGB * yiq * vec3(1.3, 1.22, 1.0), 0.0, 1.0);
      }`);
  };
  material.customProgramCacheKey = () => 'hue' + degrees;
}

const GAP = 2.3;        // spawn distance from centre
const MELEE = 0.75;     // how close a melee attacker gets to centre

class Monster {
  constructor(opts) {
    Object.assign(this, opts);
    this.root = new THREE.Group();
    this.pivot = new THREE.Group();
    this.root.add(this.pivot);
    this.pivot.add(this.model);
    scene.add(this.root);
    this.mixer = new THREE.AnimationMixer(this.model);
    this.actions = {};
    for (const [n, clip] of Object.entries(opts.clips)) this.actions[n] = this.mixer.clipAction(clip);
    this.events = [];
    this.materials = [];
    this.model.traverse((o) => {
      if (o.isMesh) {
        o.frustumCulled = false;
        for (const m of [].concat(o.material)) {
          if (m.map) { m.map.colorSpace = THREE.SRGBColorSpace; m.color.set('#ffffff'); }
          if (opts.hue) hueShift(m, opts.hue);
          m.needsUpdate = true; this.materials.push(m);
        }
      }
      if (o.isBone && /horn|head_nub/i.test(o.name)) this.hornBone = this.hornBone || o;
      if (o.isBone && /^head$/i.test(o.name)) this.headBone = o;
      if (o.isBone && /jaw_nub/i.test(o.name)) this.jawBone = o;
      if (o.isBone && /^hip$/i.test(o.name)) this.hipBone = o;
    });
    this.reset();
  }
  reset() {
    this.hp = this.maxHp; this.par = false; this.charged = false; this.evasive = false; this.fainted = false;
    this.root.position.set(this.side * GAP, 0, 0);
    this.root.rotation.set(0, this.side > 0 ? -Math.PI / 2 : Math.PI / 2, 0);
    this.pivot.rotation.set(0, 0, 0); this.pivot.position.y = 0;
    this.materials.forEach((m) => { m.transparent = false; m.opacity = 1; if (m.emissive) m.emissive.setRGB(0, 0, 0); });
    this.play('idle', { loop: true });
  }
  play(name, { loop = false, rate = 1, fade = 0.18 } = {}) {
    const a = this.actions[name];
    a.reset(); a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    a.clampWhenFinished = !loop; a.timeScale = rate * (PLAYBACK[name] || 1);
    if (this.current && this.current !== a) this.current.crossFadeTo(a, fade, false);
    a.play(); this.current = a;
    return a;
  }
  // play a clip once; onEvent fires at the clip's impact fraction; resolves when it finishes
  perform(name, onEvent) {
    const a = this.play(name);
    const dur = a.getClip().duration;
    return new Promise((res) => {
      this.events.push({ a, frac: EVENT[name] ?? 0.5, fired: false, onEvent, dur, res });
    });
  }
  update(dt) {
    this.mixer.update(dt);
    for (let i = this.events.length - 1; i >= 0; i--) {
      const e = this.events[i];
      const k = e.a.time / e.dur;
      if (!e.fired && k >= e.frac) { e.fired = true; e.onEvent && e.onEvent(); }
      if (k >= 0.999 || !e.a.isRunning()) {
        if (!e.fired) { e.fired = true; e.onEvent && e.onEvent(); }
        this.events.splice(i, 1); e.res();
      }
    }
  }
  idle() { if (!this.fainted) this.play('idle', { loop: true, fade: 0.3 }); }
  world(bone, fallbackY = 0.8) {
    const v = new THREE.Vector3();
    if (bone) bone.getWorldPosition(v); else v.set(this.root.position.x, fallbackY, 0);
    return v;
  }
  body() { return this.world(this.hipBone, 0.6).add(new THREE.Vector3(0, 0.15, 0)); }
  async walkTo(x, dur = 0.7) {
    const from = this.root.position.x;
    this.play('walk', { loop: true, fade: 0.12 });
    await tween(dur, (k) => { this.root.position.x = from + (x - from) * ease(k); });
  }
  flashHit() {
    this.materials.forEach((m) => m.emissive && m.emissive.set('#fff3a0'));
    fx.push({ life: 0.35, t: 0, update: (k) => this.materials.forEach((m) => m.emissive && m.emissive.setRGB(1 - k, (1 - k) * 0.95, (1 - k) * 0.6)), dispose() {} });
    const base = this.root.position.x;
    tween(0.12, (k) => { this.root.position.x = base + this.side * 0.22 * Math.sin(k * Math.PI); });
  }
}

// ---------- HUD ----------
const logEl = document.getElementById('log');
function log(html) {
  const p = document.createElement('p'); p.innerHTML = html; logEl.appendChild(p);
  while (logEl.children.length > 3) logEl.firstChild.remove();
}
const calloutEl = document.getElementById('callout');
async function callout(title, sub) {
  calloutEl.innerHTML = `${title}<small>${sub}</small>`;
  calloutEl.classList.add('show');
  await wait(900);
  calloutEl.classList.remove('show');
}
function drawPlate(m) {
  const el = document.getElementById(m.plate);
  const f = Math.max(0, m.hp) / m.maxHp;
  const bar = el.querySelector('.hpbar i');
  bar.style.width = (f * 100) + '%';
  bar.style.backgroundColor = f > 0.5 ? 'var(--hp-high)' : f > 0.2 ? 'var(--hp-mid)' : 'var(--hp-low)';
  el.querySelector('.hpnum').textContent = `${Math.max(0, Math.ceil(m.hp))} / ${m.maxHp} HP`;
  el.querySelector('.chips').innerHTML =
    (m.par ? '<span class="chip par">PAR</span>' : '') +
    (m.charged ? '<span class="chip chg">CHARGED</span>' : '') +
    (m.evasive ? '<span class="chip eva">EVASIVE</span>' : '');
}

// ---------- battle ----------
let A, B, battleId = 0, turn = 0;
const tag = (m) => `<b>${m.name}</b>`;

function chooseMove(me, foe) {
  const w = {
    horn: 3, fang: foe.par ? 2 : 4, leap: 2.5, spin: me.charged ? 6 : 2,
    step: me.evasive ? 0 : 1.6, charge: me.charged ? 0 : (me.hp < me.maxHp * 0.45 ? 4 : 1.4),
  };
  let total = Object.values(w).reduce((s, x) => s + x, 0), r = Math.random() * total;
  for (const [k, x] of Object.entries(w)) { if ((r -= x) <= 0) return k; }
  return 'horn';
}

function rollHit(att, def, move) {
  let acc = move.acc / 100;
  if (def.evasive) acc *= 0.45;
  return Math.random() < acc;
}
function damage(att, def, move) {
  const crit = Math.random() < 0.12;
  let d = move.power * (att.atk / def.def) * rand(0.85, 1.0);
  if (crit) d *= 1.5;
  if (att.charged) d *= 1.5;
  return { amount: Math.round(d), crit };
}

async function applyHit(att, def, move, id) {
  if (id !== battleId) return;
  const hit = rollHit(att, def, move);
  const wasEvasive = def.evasive;
  def.evasive = false;
  if (!hit) {
    popText(def.body().add(new THREE.Vector3(0, 0.6, 0)), 'MISS', 'miss');
    log(`${tag(def)} ${wasEvasive ? 'sidesteps in a burst of sparks' : 'avoids the attack'}.`);
    def.perform('dodge').then(() => def.idle());
    drawPlate(def);
    return false;
  }
  const { amount, crit } = damage(att, def, move);
  att.charged = false;
  def.hp -= amount;
  def.flashHit();
  sparks(def.body(), { count: crit ? 110 : 70 });
  lightFlash(def.body(), '#ffe14a', crit ? 22 : 14);
  screenFlash(crit ? 0.7 : 0.35);
  kick(crit ? 0.22 : 0.12);
  popText(def.body().add(new THREE.Vector3(0, 0.6, 0)), `${amount}${crit ? '!' : ''}`, crit ? 'crit' : '');
  log(`${tag(att)} ${move.line}${crit ? ' — critical hit' : ''}. ${tag(def)} takes ${amount}.`);
  if (move.par && !def.par && def.hp > 0 && Math.random() < move.par) {
    def.par = true; log(`${tag(def)} is paralyzed.`);
    bolt(() => def.body().add(new THREE.Vector3(0, 0.4, 0)), () => def.body().add(new THREE.Vector3(rand(-0.4, 0.4), -0.3, rand(-0.4, 0.4))), { life: 0.5, jitter: 0.12, segments: 6, branches: 1 });
  }
  if (move.recoil) {
    const r = Math.round(amount * move.recoil); att.hp -= r;
    log(`${tag(att)} is hit by recoil for ${r}.`);
  }
  drawPlate(def); drawPlate(att);
  return true;
}

async function doMove(att, def, key, id) {
  const move = MOVES[key];
  const toward = -att.side; // +1 means moving toward +x
  callout(move.name, `${att.name}`);
  await wait(250);
  if (id !== battleId) return;

  if (key === 'horn' || key === 'fang') {
    await att.walkTo(att.side * MELEE, 0.55);
    await att.perform(move.anim, () => {
      const tip = key === 'horn' ? att.world(att.hornBone) : att.world(att.jawBone);
      if (key === 'horn') bolt(() => att.world(att.hornBone), () => def.body(), { life: 0.4, jitter: 0.15 });
      else sparks(tip, { count: 40, color: '#66d6ff', speed: 2 });
      applyHit(att, def, move, id);
    });
    if (id !== battleId) return;
    await att.walkTo(att.side * GAP, 0.6);
  } else if (key === 'leap') {
    await att.perform('jump', async () => {
      const start = att.root.position.clone();
      shockwave(start, { radius: 2.5 });
      kick(0.1);
      const wave = new THREE.Vector3(start.x, 0.05, 0);
      const target = def.root.position.x;
      await tween(0.35, (k) => { wave.x = start.x + (target - start.x) * k; if (Math.random() < 0.6) sparks(wave.clone(), { count: 6, speed: 1.6, life: 0.4 }); });
      shockwave(def.root.position, { radius: 1.6, color: '#ffe14a' });
      applyHit(att, def, move, id);
    });
  } else if (key === 'spin') {
    const from = att.root.position.x, to = att.side * MELEE;
    const go = tween(0.9, (k) => { att.root.position.x = from + (to - from) * ease(k); });
    await att.perform('spin', () => {
      const p = att.world(att.hornBone).setY(0.05);
      skyStrike(p, 0.45); shockwave(p, { radius: 3.2, color: '#ffe14a' }); sparks(p, { count: 120, speed: 4.5, up: 2.5 });
      kick(0.25);
      applyHit(att, def, move, id);
    });
    await go;
    if (id !== battleId) return;
    await att.walkTo(att.side * GAP, 0.6);
  } else if (key === 'step') {
    att.evasive = true;
    await att.perform('dodge', () => sparks(att.body(), { count: 50, color: '#66d6ff', speed: 2.4 }));
    log(`${tag(att)} ${move.line}. Its next dodge chance rises.`);
    drawPlate(att);
  } else if (key === 'charge') {
    att.play('idle', { loop: true, rate: 1.6 });
    for (let i = 0; i < 3; i++) { skyStrike(att.body(), 0.35); kick(0.08); await wait(260); }
    att.charged = true;
    const heal = Math.min(att.maxHp - att.hp, 12);
    att.hp += heal;
    if (heal > 0) popText(att.body().add(new THREE.Vector3(0, 0.6, 0)), `+${Math.round(heal)}`, 'heal');
    log(`${tag(att)} ${move.line}. Charged up${heal > 0 ? ` and recovers ${Math.round(heal)} HP` : ''}.`);
    drawPlate(att);
  }
  if (id === battleId) att.idle();
}

async function faint(m) {
  m.fainted = true;
  m.mixer.stopAllAction();
  m.materials.forEach((x) => { x.transparent = true; });
  await tween(1.2, (k) => {
    m.pivot.rotation.z = -m.side * 0 + ease(k) * 1.4;
    m.pivot.position.y = -k * 0.15;
    m.materials.forEach((x) => { x.opacity = 1 - k * 0.7; });
  });
}

async function battle() {
  const id = ++battleId;
  turn = 0;
  A.reset(); B.reset(); drawPlate(A); drawPlate(B);
  logEl.innerHTML = '<p>Two Electric-types square off in the storm arena.</p>';
  await wait(600);
  // opening roars
  await Promise.all([A.perform('attack'), wait(300).then(() => B.perform('attack'))]);
  A.idle(); B.idle();
  while (id === battleId && A.hp > 0 && B.hp > 0) {
    turn++;
    document.getElementById('turn').textContent = `Turn ${turn}`;
    const sa = A.spd * (A.par ? 0.5 : 1), sb = B.spd * (B.par ? 0.5 : 1);
    const order = sa === sb ? (Math.random() < 0.5 ? [A, B] : [B, A]) : (sa > sb ? [A, B] : [B, A]);
    for (const att of order) {
      const def = att === A ? B : A;
      if (id !== battleId || att.hp <= 0 || def.hp <= 0) break;
      if (att.par && Math.random() < 0.25) {
        log(`${tag(att)} is paralyzed and can't move.`);
        bolt(() => att.body().add(new THREE.Vector3(0, 0.5, 0)), () => att.body().add(new THREE.Vector3(rand(-0.5, 0.5), -0.4, 0)), { life: 0.5, segments: 6 });
        att.flashHit();
        await wait(900);
        continue;
      }
      if (att.par && Math.random() < 0.2) { att.par = false; log(`${tag(att)} shakes off the paralysis.`); drawPlate(att); }
      await doMove(att, def, chooseMove(att, def), id);
      await wait(450);
    }
  }
  if (id !== battleId) return;
  const loser = A.hp <= 0 ? A : B, winner = loser === A ? B : A;
  log(`${tag(loser)} faints. ${tag(winner)} wins the battle.`);
  await faint(loser);
  callout(`${winner.name} wins`, `after ${turn} turns`);
  await winner.perform('jump', () => { skyStrike(winner.body(), 0.5); shockwave(winner.root.position, { radius: 2.4, color: '#ffe14a' }); });
  winner.idle();
  await wait(3500);
  if (id === battleId) battle();
}

// ---------- loop ----------
const clock = new THREE.Clock();
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 60 : 42;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
function frame() {
  const raw = Math.min(clock.getDelta(), 0.05);
  const dt = paused ? 0 : raw * speed;
  gameTime += dt;
  tickTimers();
  if (A) { A.update(dt); B.update(dt); }
  runFx(dt);
  // camera: slow orbit around the arena, framing both fighters
  const t = gameTime * 0.08;
  const r = camera.aspect < 0.8 ? 9.5 : 7.2;
  camera.position.set(Math.sin(t) * 1.6, 2.1 + Math.sin(t * 0.7) * 0.25, r);
  const look = new THREE.Vector3(0, 0.75, 0);
  if (shake > 0) {
    camera.position.x += rand(-shake, shake); camera.position.y += rand(-shake, shake);
    shake = Math.max(0, shake - raw * 0.8);
  }
  camera.lookAt(look);
  motes.rotation.y += dt * 0.02;
  pylons.forEach((p, i) => { p.material.emissiveIntensity = 0.3 + 0.25 * Math.max(0, Math.sin(gameTime * 3 + i * 1.7)); });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const btnPause = document.getElementById('btnPause'), btnSpeed = document.getElementById('btnSpeed');
btnPause.onclick = () => { paused = !paused; btnPause.textContent = paused ? 'Resume' : 'Pause'; btnPause.setAttribute('aria-pressed', String(paused)); };
btnSpeed.onclick = () => { speed = speed === 1 ? 2 : 1; btnSpeed.textContent = `Speed ${speed}×`; btnSpeed.setAttribute('aria-pressed', String(speed === 2)); };
document.getElementById('btnNew').onclick = () => { timers.length = 0; A.events.length = 0; B.events.length = 0; battle(); };

// ---------- boot ----------
(async function boot() {
  resize(); frame();
  const msg = document.getElementById('loadmsg');
  try {
    const rigBuf = await (await fetch(ASSETS.rig)).arrayBuffer();
    msg.textContent = 'Loading animations…';
    const gl = new GLTFLoader();
    const clips = {};
    await Promise.all(CLIPS.map(async (n) => { clips[n] = (await gl.loadAsync(ASSETS.anim(n))).animations[0]; }));
    const fbx = new FBXLoader();
    const makeModel = () => {
      const m = fbx.parse(rigBuf, '');
      const box = new THREE.Box3().setFromObject(m);
      const s = 1.45 / (box.max.y - box.min.y);
      m.scale.setScalar(s);
      return m;
    };
    A = new Monster({ name: 'Voltusk', plate: 'plateA', side: -1, model: makeModel(), clips, maxHp: 120, atk: 1.05, def: 1.0, spd: 52 });
    B = new Monster({ name: 'Shockhorn', plate: 'plateB', side: 1, model: makeModel(), clips, maxHp: 115, atk: 1.1, def: 0.95, spd: 50, hue: 175 });
    document.getElementById('loading').hidden = true;
    battle();
  } catch (e) {
    msg.textContent = 'The arena could not load its files. Reload the page to try again.';
    console.error(e);
  }
})();
</script>
