<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mine Viewer</title>
<style>
  :root { --bg:#dcd6cb; --panel:rgba(30,28,24,.88); --fg:#eee6d8; --accent:#c9783a; }
  html,body { margin:0; height:100%; background:var(--bg); font:13px system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; }
  #ref { position:absolute; top:0; pointer-events:none; opacity:0; }
  #ui { position:absolute; top:12px; left:12px; width:250px; max-height:calc(100% - 24px); overflow:auto;
        background:var(--panel); color:var(--fg); border-radius:8px; padding:12px; box-sizing:border-box; }
  h1 { font-size:15px; margin:0 0 8px; } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin:14px 0 6px; }
  label { display:flex; align-items:center; gap:8px; margin:4px 0; } label span { width:70px; } input[type=range] { flex:1; }
  button { background:#4a4438; color:var(--fg); border:0; border-radius:4px; padding:5px 8px; margin:2px; cursor:pointer; }
  button:hover { background:var(--accent); } .danger { background:#7a2f22; }
  #hint { position:absolute; bottom:10px; right:12px; color:#3a352c; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <h1>Iron Mine</h1>
  <h2>Conveyor</h2>
  <label><input type="checkbox" id="run" checked> running</label>
  <label><span>speed</span><input type="range" id="speed" min="0" max="3" step="0.1" value="1.2"></label>
  <label><input type="checkbox" id="auto"> auto production cycle</label>
  <h2>Fill levels</h2>
  <div id="fills"></div>
  <h2>Destroy</h2>
  <div id="destroy"></div>
  <button class="danger" id="all">Demolish all</button> <button id="rebuild">Rebuild</button>
  <h2>View</h2>
  <label><input type="checkbox" id="terrain" checked> preview terrain</label>
  <button id="refview">Reference camera</button>
  <label><span>overlay</span><input type="range" id="refop" min="0" max="1" step="0.05" value="0"></label>
  <h2>Export</h2>
  <button id="export">Download .glb</button>
</div>
<img id="ref" src="reference.webp" alt="">
<div id="hint">Click a part to destroy it · Shift+click destroys its whole section · drag to orbit</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { createMine, REFERENCE_VIEW as RV, portalToWorld } from './mine.js';

const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcd6cb);
// Orthographic camera matching the reference render (see REFERENCE_VIEW in mine.js).
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
function referenceView() {
  const a = RV.azimuth, e = RV.elevation, s = RV.pxPerMetre, [W, H] = RV.size;
  const right = new THREE.Vector3(Math.cos(a), 0, -Math.sin(a));
  const up = new THREE.Vector3(-Math.sin(e) * Math.sin(a), Math.cos(e), -Math.sin(e) * Math.cos(a));
  const back = new THREE.Vector3(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a));
  // world point under the centre of the reference image
  const centre = right.multiplyScalar((W / 2 - RV.origin[0]) / s).add(up.multiplyScalar((RV.origin[1] - H / 2) / s));
  controls.target.copy(centre);
  camera.position.copy(centre).addScaledVector(back, 80);
  camera.zoom = 1;
  camera.lookAt(centre);
  resize();
}
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5a40, 1.8));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.position.set(-14, 26, 10);
sun.target.position.set(3, 0, -4);
scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 80 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const mine = createMine();
scene.add(mine.root);

// Viewer-only preview terrain (not part of the asset): flat ground + a mound the tunnel runs into.
const preview = new THREE.Group();
{
  const g = new THREE.CircleGeometry(40, 64);
  g.rotateX(-Math.PI / 2);
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x6c5d40, roughness: 1 }));
  ground.receiveShadow = true;
  preview.add(ground);
  const hg = new THREE.IcosahedronGeometry(1, 5), p = hg.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = Math.sin(v.x * 7.1) * Math.sin(v.z * 6.3 + v.y * 3) * 0.05 + Math.sin(v.x * 17 + v.z * 13) * 0.02;
    v.multiplyScalar(1 + n);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  hg.computeVertexNormals();
  const hill = new THREE.Mesh(hg, new THREE.MeshStandardMaterial({ color: 0x6a5d44, roughness: 1, flatShading: true }));
  const [hx, hz] = portalToWorld(0, -15.5);
  hill.position.set(hx, -0.5, hz);
  hill.scale.set(10, 9, 10);
  hill.castShadow = hill.receiveShadow = true;
  preview.add(hill);
}
scene.add(preview);
mine.setFill('bin_0', 1, { instant: true });
mine.setFill('bin_1', 1, { instant: true });
mine.setFill('bin_2', 1, { instant: true });
mine.setFill('hopper', 1, { instant: true });
mine.setAutoCycle(false);

function resize() {
  // keep the reference scale: the window height shows as much as the reference image height
  const halfH = RV.size[1] / 2 / RV.pxPerMetre, a = innerWidth / innerHeight;
  Object.assign(camera, { left: -halfH * a, right: halfH * a, top: halfH, bottom: -halfH });
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  const ref = $('ref');
  const k = innerHeight / RV.size[1];
  ref.style.width = RV.size[0] * k + 'px';
  ref.style.height = innerHeight + 'px';
  ref.style.left = (innerWidth - RV.size[0] * k) / 2 + 'px';
}
addEventListener('resize', resize);
referenceView();

// ---- UI
$('run').onchange = e => mine.setConveyor({ running: e.target.checked });
$('speed').oninput = e => mine.setConveyor({ speed: +e.target.value });
$('auto').onchange = e => mine.setAutoCycle(e.target.checked);
const sliders = {};
for (const name of mine.fillNames) {
  const row = document.createElement('label');
  row.innerHTML = `<span>${name}</span><input type="range" min="0" max="1" step="0.01">`;
  const input = row.querySelector('input');
  input.oninput = () => mine.setFill(name, +input.value, { rate: 0.8 });
  sliders[name] = input;
  $('fills').appendChild(row);
}
for (const name of mine.sections) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => mine.destroy(name);
  $('destroy').appendChild(b);
}
$('refview').onclick = referenceView;
$('terrain').onchange = e => preview.visible = e.target.checked;
$('refop').oninput = e => $('ref').style.opacity = e.target.value;
if (new URLSearchParams(location.search).has('overlay')) { $('ref').style.opacity = 0.5; $('refop').value = 0.5; }
$('all').onclick = () => mine.destroyAll();
$('rebuild').onclick = () => mine.rebuild();
$('export').onclick = async () => {
  await mine.ready;
  mine.rebuild();
  new GLTFExporter().parse(mine.root, glb => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    a.download = 'mine.glb'; a.click();
  }, console.error, { binary: true, onlyVisible: false });
};

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ndc, camera);
  for (const hit of ray.intersectObject(mine.root, true)) {
    const info = mine.partOf(hit.object);
    if (!info || !info.section || hit.object.userData.debris || hit.object.userData.flying) continue;
    mine.destroy(e.shiftKey ? info.section : info.part);
    break;
  }
});

window.__view = { camera, controls, mine, preview };
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  mine.update(clock.getDelta());
  for (const n in sliders) if (document.activeElement !== sliders[n]) sliders[n].value = mine.getFill(n);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
