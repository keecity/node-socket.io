<title>Ridgeline Terrain Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#10140f; --panel:rgba(16,21,17,.86); --line:rgba(206,219,196,.12); --line-2:rgba(206,219,196,.26);
  --ink:#e6ecdf; --ink-2:#a9b5a3; --ink-3:#77846f; --moss:#a6c26b; --snow:#dfe8ee; --warn:#e3a45a;
  --ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);overflow:hidden}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%}
.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:300px;
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em;text-wrap:balance}
.stat{font-family:var(--mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:1.4em}
.stat.busy{color:var(--warn)}
.body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
legend{padding:10px 0 2px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--moss)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.row label{font-size:13px;color:var(--ink-2)}
.row output{font-family:var(--mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:var(--moss);height:18px}
.inline{display:flex;gap:8px;align-items:center}
select,input[type=number]{font:500 12px var(--mono);color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line-2);padding:5px 7px;min-width:0}
input[type=number]{width:90px}
button{font:500 13px var(--ui);color:var(--ink);background:transparent;border:1px solid var(--line-2);padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ink-2)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.hint{font-size:12px;color:var(--ink-3);line-height:1.45}
.toggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;display:none}
@media (max-width:640px){
  .panel{top:auto;left:12px;right:12px;width:auto;height:46%}
  .panel.closed{display:none}
  .toggle{display:block;background:var(--panel)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<button class="toggle" id="toggle" type="button">Controls</button>

  <div class="head">
    <h1>Ridgeline terrain lab</h1>
    <div class="stat" id="stat" aria-live="polite">Generating…</div>
  </div>
  <div class="body" id="controls">
    <fieldset>
      <legend>Tile</legend>

        <label for="seed" class="hint">Seed</label><input type="number" id="seed" value="7" min="1" step="1">
        <button type="button" id="reseed">New seed</button>
      </div>
      <div class="inline">
        <label for="res" class="hint">Grid</label>
        <select id="res"><option value="128">129 × 129</option><option value="256" selected>257 × 257</option><option value="384">385 × 385</option><option value="512">513 × 513</option></select>
      </div>
    </fieldset>
    <fieldset id="fs-shape"><legend>Shape</legend></fieldset>

    <fieldset id="fs-light"><legend>Light</legend></fieldset>
    <fieldset id="fs-water"><legend>Water and shore</legend></fieldset>
    <p class="hint">Tile is 8 × 8 km. Drag to orbit, right-drag to pan, scroll or pinch to zoom toward the cursor (+/− keys also zoom). Shape and erosion regenerate the tile; surface and light update live.</p>
  </div>
</aside>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Sky} from 'three/addons/objects/Sky.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
const {createTerrain, buildTile, flatPointAt, gridIndex, DEFAULT_TERRAIN}=(()=>{
// Terrain generator — pure JS, no dependencies, safe to run in a Web Worker.
//
// Height is a function of a 3D point and its local "up" direction, so the same code drives
// a flat test tile now (up = +Y) and quad-sphere planet tiles later (up = normalize(p)).
// Everything is seeded and deterministic: a tile rebuilt from the same address is identical.
//
// Layers:
//   1. region mask   — where mountain ranges vs. flat valley floors are
//   2. domain warp   — bends ridgelines so they branch instead of lining up on a grid
//   3. ridged multifractal with derivative damping — sharp crests, eroded-looking flanks
//   4. gully filter  — slope-aligned channels running downhill (triplanar, seamless on a sphere)
//   5. droplet erosion (optional, per grid) — hydraulic carving + sediment fans
//
// Units are arbitrary; the lab uses kilometres.

const DEFAULT_TERRAIN = {
  seed: 7,
  mountainHeight: 1.35,   // peak height above the valley floor
  valleyHeight: 0.05,     // relief of the flat areas
  coverage: 0.52,         // 0..1, how much of the land is mountains
  maskScale: 0.11,        // frequency of the mountain/valley regions
  ridgeScale: 0.32,       // base frequency of the ridges
  octaves: 9,
  sharpness: 2.1,         // ridge crest sharpness (1 = rounded, 3 = knife edges)
  ridgeGain: 1.9,         // how much detail follows existing ridges
  erosionDamping: 0.55,   // derivative damping: smooth slopes, detail stays on crests and flats
  warp: 0.75,             // domain warp amount
  warpScale: 0.18,
  gullyStrength: 0.9,     // slope-aligned channel depth
  gullyScale: 3.2,        // channel frequency
  gullySlope: 3.0,        // how strongly slope steers the channels
  gullyOctaves: 5,
  pads: null,             // [{x,y,z,r,fall,h,rough}] flattened settlement areas (same units)
};

// ---------------------------------------------------------------- noise
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function makeNoise(seed){
  const r=mulberry(seed*9973+17), perm=new Uint8Array(512), val=new Float32Array(256);
  for(let i=0;i<256;i++){ perm[i]=i; val[i]=r()*2-1; }
  for(let i=255;i>0;i--){ const j=(r()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<256;i++) perm[i+256]=perm[i];
  const H=(x,y,z)=>val[perm[perm[perm[x&255]+(y&255)]+(z&255)]];

  // value noise with analytic derivatives (quintic). out = [value, dx, dy, dz], value in ~[-1,1]
  function noised(x,y,z,out){
    const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z), fx=x-ix, fy=y-iy, fz=z-iz;
    const ux=fx*fx*fx*(fx*(fx*6-15)+10), uy=fy*fy*fy*(fy*(fy*6-15)+10), uz=fz*fz*fz*(fz*(fz*6-15)+10);
    const dux=30*fx*fx*(fx*(fx-2)+1), duy=30*fy*fy*(fy*(fy-2)+1), duz=30*fz*fz*(fz*(fz-2)+1);
    const a=H(ix,iy,iz), b=H(ix+1,iy,iz), c=H(ix,iy+1,iz), d=H(ix+1,iy+1,iz);
    const e=H(ix,iy,iz+1), f=H(ix+1,iy,iz+1), g=H(ix,iy+1,iz+1), h=H(ix+1,iy+1,iz+1);
    const k1=b-a, k2=c-a, k3=e-a, k4=a-b-c+d, k5=a-c-e+g, k6=a-b-e+f, k7=-a+b+c-d+e-f-g+h;
    out[0]=a+k1*ux+k2*uy+k3*uz+k4*ux*uy+k5*uy*uz+k6*uz*ux+k7*ux*uy*uz;
    out[1]=dux*(k1+k4*uy+k6*uz+k7*uy*uz);
    out[2]=duy*(k2+k5*uz+k4*ux+k7*uz*ux);
    out[3]=duz*(k3+k6*ux+k5*uy+k7*ux*uy);
    return out;
  }
  // 2D cell hash for the gully filter
  const hash2=(x,y,o)=>{ const i=perm[perm[x&255]+(y&255)]; o[0]=val[i]*0.5+0.5; o[1]=val[perm[i+37]]*0.5+0.5; return o; };
  return {noised,hash2};
}

// octave rotation (breaks grid alignment between octaves)
const RM=[0.00,0.80,0.60, -0.80,0.36,-0.48, -0.60,-0.48,0.64];

// ---------------------------------------------------------------- terrain
function createTerrain(opts={}){
  const P={...DEFAULT_TERRAIN,...opts};
  const N=makeNoise(P.seed), nd=[0,0,0,0], hc=[0,0];

  // fbm value + world-space gradient. out=[v,gx,gy,gz]
  function fbm(x,y,z,freq,oct,out){
    let m0=freq,m1=0,m2=0,m3=0,m4=freq,m5=0,m6=0,m7=0,m8=freq;   // accumulated matrix M (q = M p)
    let v=0,gx=0,gy=0,gz=0,a=0.5,norm=0;
    for(let i=0;i<oct;i++){
      N.noised(m0*x+m1*y+m2*z, m3*x+m4*y+m5*z, m6*x+m7*y+m8*z, nd);
      v+=a*nd[0]; norm+=a;
      gx+=a*(m0*nd[1]+m3*nd[2]+m6*nd[3]); gy+=a*(m1*nd[1]+m4*nd[2]+m7*nd[3]); gz+=a*(m2*nd[1]+m5*nd[2]+m8*nd[3]);
      const n0=2*(RM[0]*m0+RM[1]*m3+RM[2]*m6), n1=2*(RM[0]*m1+RM[1]*m4+RM[2]*m7), n2=2*(RM[0]*m2+RM[1]*m5+RM[2]*m8);
      const n3=2*(RM[3]*m0+RM[4]*m3+RM[5]*m6), n4=2*(RM[3]*m1+RM[4]*m4+RM[5]*m7), n5=2*(RM[3]*m2+RM[4]*m5+RM[5]*m8);
      const n6=2*(RM[6]*m0+RM[7]*m3+RM[8]*m6), n7=2*(RM[6]*m1+RM[7]*m4+RM[8]*m7), n8=2*(RM[6]*m2+RM[7]*m5+RM[8]*m8);
      m0=n0;m1=n1;m2=n2;m3=n3;m4=n4;m5=n5;m6=n6;m7=n7;m8=n8; a*=0.5;
    }
    out[0]=v/norm; out[1]=gx/norm; out[2]=gy/norm; out[3]=gz/norm; return out;
  }

  // ridged multifractal with derivative damping. returns [h 0..~1, gx, gy, gz]
  function ridged(x,y,z,out){
    let m0=P.ridgeScale,m1=0,m2=0,m3=0,m4=P.ridgeScale,m5=0,m6=0,m7=0,m8=P.ridgeScale;
    let sum=0,a=1,w=1,dx=0,dy=0,dz=0,gx=0,gy=0,gz=0,norm=0;
    for(let i=0;i<P.octaves;i++){
      N.noised(m0*x+m1*y+m2*z, m3*x+m4*y+m5*z, m6*x+m7*y+m8*z, nd);
      const wx=m0*nd[1]+m3*nd[2]+m6*nd[3], wy=m1*nd[1]+m4*nd[2]+m7*nd[3], wz=m2*nd[1]+m5*nd[2]+m8*nd[3];
      const s=nd[0]<0?-1:1, r0=1-Math.abs(nd[0]), r=Math.pow(Math.max(r0,0),P.sharpness);
      const k=-s*P.sharpness*Math.pow(Math.max(r0,1e-4),P.sharpness-1);   // d(ridge)/d(noise)
      const rx=k*wx, ry=k*wy, rz=k*wz;
      // damping: detail is suppressed where the accumulated slope is steep (flanks stay clean, crests stay busy)
      const damp=1/(1+P.erosionDamping*(dx*dx+dy*dy+dz*dz));
      const c=a*w*r*damp; sum+=c; norm+=a;
      gx+=a*w*damp*rx; gy+=a*w*damp*ry; gz+=a*w*damp*rz;
      dx+=a*rx*w; dy+=a*ry*w; dz+=a*rz*w;
      w=Math.min(1,Math.max(0,r*P.ridgeGain));
      const n0=2*(RM[0]*m0+RM[1]*m3+RM[2]*m6), n1=2*(RM[0]*m1+RM[1]*m4+RM[2]*m7), n2=2*(RM[0]*m2+RM[1]*m5+RM[2]*m8);
      const n3=2*(RM[3]*m0+RM[4]*m3+RM[5]*m6), n4=2*(RM[3]*m1+RM[4]*m4+RM[5]*m7), n5=2*(RM[3]*m2+RM[4]*m5+RM[5]*m8);
      const n6=2*(RM[6]*m0+RM[7]*m3+RM[8]*m6), n7=2*(RM[6]*m1+RM[7]*m4+RM[8]*m7), n8=2*(RM[6]*m2+RM[7]*m5+RM[8]*m8);
      m0=n0;m1=n1;m2=n2;m3=n3;m4=n4;m5=n5;m6=n6;m7=n7;m8=n8; a*=0.5;
    }
    out[0]=sum/norm; out[1]=gx/norm; out[2]=gy/norm; out[3]=gz/norm; return out;
  }

  // gully filter (after clayjohn's "eroded terrain noise"): slope-aligned cosine stripes in a
  // jittered cell grid. (u,v) are plane coords, (ga,gb) the height gradient in that plane.
  const TAU=Math.PI*2;
  function erosionCell(u,v,dirx,diry,o){
    const iu=Math.floor(u), iv=Math.floor(v), fu=u-iu, fv=v-iv; let va=0,vb=0,vc=0,wt=0;
    for(let i=-2;i<=1;i++) for(let j=-2;j<=1;j++){
      N.hash2(iu-i,iv-j,hc); const pu=fu+i-hc[0]*0.5, pv=fv+j-hc[1]*0.5;
      const w=Math.exp(-(pu*pu+pv*pv)*2); wt+=w; const mag=(pu*dirx+pv*diry)*TAU;
      va+=Math.cos(mag)*w; const sn=-Math.sin(mag)*w; vb+=sn*dirx; vc+=sn*diry;
    }
    o[0]=va/wt; o[1]=vb/wt; o[2]=vc/wt; return o;
  }
  const eo=[0,0,0];
  function gullyPlane(u,v,ga,gb){
    let hx=0,hy=0,hz=0,a=0.5,f=1;
    const bx=gb*P.gullySlope, by=-ga*P.gullySlope;      // gradient rotated 90° → stripes run downhill
    for(let i=0;i<P.gullyOctaves;i++){
      erosionCell(u*P.gullyScale*f, v*P.gullyScale*f, bx+hz, by-hy, eo);
      hx+=eo[0]*a; hy+=eo[1]*a*f; hz+=eo[2]*a*f; a*=0.4; f*=2;
    }
    return hx;   // ~[-1,1]: negative = channel, positive = spur
  }

  const t4=[0,0,0,0], w1=[0,0,0,0], w2=[0,0,0,0], w3=[0,0,0,0], rg=[0,0,0,0], vl=[0,0,0,0];
  // Height at 3D point p with local up u. out = {h, gully, mountain}
  function sample(px,py,pz,ux,uy,uz,out){
    // 1. regions
    fbm(px+31.7,py-12.3,pz+5.1,P.maskScale,4,t4);
    const m0=t4[0]*0.5+0.5, lo=P.coverage-0.12, hi=P.coverage+0.12;
    let mt=Math.min(1,Math.max(0,(m0-(1-hi))/((1-lo)-(1-hi)))); mt=mt*mt*(3-2*mt);
    // 2. warp
    fbm(px,py,pz,P.warpScale,3,w1); fbm(px+17.1,py+3.3,pz-9.2,P.warpScale,3,w2); fbm(px-5.7,py+11.9,pz+23.4,P.warpScale,3,w3);
    const qx=px+P.warp*w1[0], qy=py+P.warp*w2[0], qz=pz+P.warp*w3[0];
    // 3. ridges (+ gentle valley floor)
    ridged(qx,qy,qz,rg); fbm(px-40,py+2,pz+11,0.9,4,vl);
    let mh=P.mountainHeight*mt; const vh=P.valleyHeight;
    let h=vh*(vl[0]*0.5+0.5)+mh*rg[0]*rg[0]*1.6;        // squaring keeps valley floors flat, lifts peaks
    const gs=mh*rg[0]*3.2, gx=gs*rg[1]+vh*0.5*vl[1], gy=gs*rg[2]+vh*0.5*vl[2], gz=gs*rg[3]+vh*0.5*vl[3];
    // 4. gullies — gradient projected onto the tangent plane, triplanar-blended by up (seamless on a sphere)
    const gd=gx*ux+gy*uy+gz*uz, tx=gx-ux*gd, ty=gy-uy*gd, tz=gz-uz*gd, slope=Math.hypot(tx,ty,tz);
    let gully=0;
    if(P.gullyStrength>0&&mh>1e-4){
      let ax=ux*ux*ux*ux, ay=uy*uy*uy*uy, az=uz*uz*uz*uz; const s=ax+ay+az; ax/=s; ay/=s; az/=s;
      if(ay>0.01) gully+=ay*gullyPlane(px,pz,tx,tz);
      if(ax>0.01) gully+=ax*gullyPlane(pz,py,tz,ty);
      if(az>0.01) gully+=az*gullyPlane(px,py,tx,ty);
      const sm=Math.min(1,slope/0.9);                 // only on slopes
      h+=gully*P.gullyStrength*0.06*mh*sm*(0.35+0.65*rg[0]);
      gully*=sm;
    }
    // 5. settlement pads: flatten an area (towns, arenas) and blend it into the surroundings
    if(P.pads) for(let i=0;i<P.pads.length;i++){ const pd=P.pads[i], d=Math.hypot(px-pd.x,py-(pd.y||0),pz-pd.z);
      if(d<pd.r+pd.fall){ let w=Math.min(1,Math.max(0,1-(d-pd.r)/pd.fall)); w=w*w*(3-2*w);
        h+=(pd.h+(pd.rough||0)*vl[0]-h)*w; gully*=1-w; mt*=1-w; } }
    out.h=h; out.gully=gully; out.mountain=mt; return out;
  }
  return {params:P, sample};
}

// ---------------------------------------------------------------- tile grid
// Builds one tile. pointAt(u,v,out) maps tile coords (0..1, margin may go outside) to a base
// point {x,y,z} and unit up {ux,uy,uz}; the surface point is base + up*h.
// Flat tile:  base = (x0+u*size, 0, z0+v*size), up = +Y.
// Planet tile: base = cubeToSphere(face,u,v)*R, up = normalize(base).
function buildTile(terrain, {res=256, pointAt, droplets=0, dropletSeed=1, cellSize=1}){
  const M=4, W=res+1+2*M, n=W*W;                         // margin for normals, cavity, erosion
  const bx=new Float32Array(n), by=new Float32Array(n), bz=new Float32Array(n), ux=new Float32Array(n), uy=new Float32Array(n), uz=new Float32Array(n);
  const h=new Float32Array(n), gully=new Float32Array(n), mount=new Float32Array(n), pt={x:0,y:0,z:0,ux:0,uy:1,uz:0}, s={};
  for(let j=0;j<W;j++) for(let i=0;i<W;i++){
    const k=j*W+i; pointAt((i-M)/res,(j-M)/res,pt);
    bx[k]=pt.x; by[k]=pt.y; bz[k]=pt.z; ux[k]=pt.ux; uy[k]=pt.uy; uz[k]=pt.uz;
    terrain.sample(pt.x,pt.y,pt.z,pt.ux,pt.uy,pt.uz,s); h[k]=s.h; gully[k]=s.gully; mount[k]=s.mountain;
  }
  let flow=new Float32Array(n), dep=new Float32Array(n);
  if(droplets>0) ({flow,dep}=erodeDroplets(h,W,{droplets,seed:dropletSeed,cellSize,margin:M}));

  // outputs (interior only)
  const V=(res+1)*(res+1), pos=new Float32Array(V*3), nor=new Float32Array(V*3), terr=new Float32Array(V*4);
  const X=k=>bx[k]+ux[k]*h[k], Y=k=>by[k]+uy[k]*h[k], Z=k=>bz[k]+uz[k]*h[k];
  let hmin=1e9,hmax=-1e9;
  for(let j=0;j<=res;j++) for(let i=0;i<=res;i++){
    const k=(j+M)*W+(i+M), o=j*(res+1)+i;
    pos[o*3]=X(k); pos[o*3+1]=Y(k); pos[o*3+2]=Z(k);
    // normal from neighbours (works for flat and curved tiles)
    const l=k-1, r=k+1, d=k-W, u=k+W;
    const ax=X(r)-X(l), ay=Y(r)-Y(l), az=Z(r)-Z(l), cx=X(u)-X(d), cy=Y(u)-Y(d), cz=Z(u)-Z(d);
    let nx=cy*az-cz*ay, ny=cz*ax-cx*az, nz=cx*ay-cy*ax; const L=Math.hypot(nx,ny,nz)||1;
    if(nx*ux[k]+ny*uy[k]+nz*uz[k]<0) { nx=-nx; ny=-ny; nz=-nz; }
    nor[o*3]=nx/L; nor[o*3+1]=ny/L; nor[o*3+2]=nz/L;
    // cavity: + in creases/valleys, - on crests (in height units per cell)
    const cav=(h[l]+h[r]+h[d]+h[u]+0.5*(h[d-1]+h[d+1]+h[u-1]+h[u+1]))/6-h[k];
    terr[o*4]=h[k]; terr[o*4+1]=gully[k]; terr[o*4+2]=cav/cellSize; terr[o*4+3]=Math.min(1,flow[k]*0.05+dep[k]*15)*(droplets>0?1:0);
    if(h[k]<hmin) hmin=h[k]; if(h[k]>hmax) hmax=h[k];
  }

aps tile coords (0..1, margin may go outside) to a base\n// point {x,y,z} and unit up {ux,uy,uz}; the surface point is base + up*h.\n// Flat tile:  base = (x0+u*size, 0, z0+v*size), up = +Y.\n// Planet tile: base = cubeToSphere(face,u,v)*R, up = normalize(base).\nfunction buildTile(terrain, {res=256, pointAt, droplets=0, dropletSeed=1, cellSize=1}){\n  const M=4, W=res+1+2*M, n=W*W;                         // margin for normals, cavity, erosion\n  const bx=new Float32Array(n), by=new Float32Array(n), bz=new Float32Array(n), ux=new Float32Array(n), uy=new Float32Array(n), uz=new Float32Array(n);\n  const h=new Float32Array(n), gully=new Float32Array(n), mount=new Float32Array(n), pt={x:0,y:0,z:0,ux:0,uy:1,uz:0}, s={};\n  for(let j=0;j<W;j++) for(let i=0;i<W;i++){\n    const k=j*W+i; pointAt((i-M)/res,(j-M)/res,pt);\n    bx[k]=pt.x; by[k]=pt.y; bz[k]=pt.z; ux[k]=pt.ux; uy[k]=pt.uy; uz[k]=pt.uz;\n    terrain.sample(pt.x,pt.y,pt.z,pt.ux,pt.uy,pt.uz,s); h[k]=s.h; gully[k]=s.gully; mount[k]=s.mountain;\n  }\n  let flow=new Float32Array(n), dep=new Float32Array(n);\n  if(droplets>0) ({flow,dep}=erodeDroplets(h,W,{droplets,seed:dropletSeed,cellSize,margin:M}));\n\n  // outputs (interior only)\n  const V=(res+1)*(res+1), pos=new Float32Array(V*3), nor=new Float32Array(V*3), terr=new Float32Array(V*4);\n  const X=k=>bx[k]+ux[k]*h[k], Y=k=>by[k]+uy[k]*h[k], Z=k=>bz[k]+uz[k]*h[k];\n  let hmin=1e9,hmax=-1e9;\n  for(let j=0;j<=res;j++) for(let i=0;i<=res;i++){\n    const k=(j+M)*W+(i+M), o=j*(res+1)+i;\n    pos[o*3]=X(k); pos[o*3+1]=Y(k); pos[o*3+2]=Z(k);\n    // normal from neighbours (works for flat and curved tiles)\n    const l=k-1, r=k+1, d=k-W, u=k+W;\n    const ax=X(r)-X(l), ay=Y(r)-Y(l), az=Z(r)-Z(l), cx=X(u)-X(d), cy=Y(u)-Y(d), cz=Z(u)-Z(d);\n    let nx=cy*az-cz*ay, ny=cz*ax-cx*az, nz=cx*ay-cy*ax; const L=Math.hypot(nx,ny,nz)||1;\n    if(nx*ux[k]+ny*uy[k]+nz*uz[k]<0) { nx=-nx; ny=-ny; nz=-nz; }\n    nor[o*3]=nx/L; nor[o*3+1]=ny/L; nor[o*3+2]=nz/L;\n    // cavity: + in creases/valleys, - on crests (in height units per cell)\n    const cav=(h[l]+h[r]+h[d]+h[u]+0.5*(h[d-1]+h[d+1]+h[u-1]+h[u+1]))/6-h[k];\n    terr[o*4]=h[k]; terr[o*4+1]=gully[k]; terr[o*4+2]=cav/cellSize; terr[o*4+3]=Math.min(1,flow[k]*0.05+dep[k]*15)*(droplets>0?1:0);\n    if(h[k]<hmin) hmin=h[k]; if(h[k]>hmax) hmax=h[k];\n  }\n  return {res,positions:pos,normals:nor,terrain:terr,hmin,hmax,mountain:mount};\n}\n\nfunction flatPointAt(x0,z0,size){ return (u,v,o)=>{ o.x=x0+u*size; o.y=0; o.z=z0+v*size; o.ux=0; o.uy=1; o.uz=0; return o; }; }\n\n// shared index buffer for a (res+1)^2 grid\nfunction gridIndex(res){\n  const idx=new Uint32Array(res*res*6); let t=0;\n  for(let j=0;j<res;j++) for(let i=0;i<res;i++){ const a=j*(res+1)+i, b=a+1, c=a+res+1, d=c+1;\n    if((i+j)&1){ idx[t++]=a; idx[t++]=c; idx[t++]=b; idx[t++]=b; idx[t++]=c; idx[t++]=d; }\n    else { idx[t++]=a; idx[t++]=c; idx[t++]=d; idx[t++]=a; idx[t++]=d; idx[t++]=b; } }\n  return idx;\n}\n\n// ---------------------------------------------------------------- hydraulic droplet erosion\n// Particle erosion on a square height grid (after Hans Beyer / Sebastian Lague). Modifies h in place.\n// Returns per-cell flow (how much water passed) and deposition, which the material uses.\n// For the planet this runs on regions larger than a tile (margins) so seams stay hidden.\nfunction erodeDroplets(h,W,{droplets=50000,seed=1,cellSize=1,margin=0,\n  inertia=0.05,capacity=5,minCapacity=0.01,erodeRate=0.35,depositRate=0.25,evaporate=0.015,gravity=4,life=40,radius=3}={}){\n  const r=mulberry(seed*131+7), n=W*W, flow=new Float32Array(n), dep=new Float32Array(n);\n  let hmax=0; for(let i=0;i<n;i++) hmax=Math.max(hmax,Math.abs(h[i]));\n  const S=(1/cellSize)/(W*0.004+1);   // height \u2192 \"cell units\" so slopes are in a sane range at any scale\n  const hs=new Float32Array(n); for(let i=0;i<n;i++) hs[i]=h[i]*S;\n  // erosion brush\n  const bo=[], bw=[]; let bs=0;\n  for(let y=-radius;y<=radius;y++) for(let x=-radius;x<=radius;x++){ const d=Math.hypot(x,y); if(d<radius){ bo.push([x,y]); const w=1-d/radius; bw.push(w); bs+=w; } }\n  for(let i=0;i<bw.length;i++) bw[i]/=bs;\n  const grad=(x,y)=>{ const ix=x|0, iy=y|0, fx=x-ix, fy=y-iy, k=iy*W+ix;\n    const a=hs[k], b=hs[k+1], c=hs[k+W], d=hs[k+W+1];\n    return [(b-a)*(1-fy)+(d-c)*fy, (c-a)*(1-fx)+(d-b)*fx, a*(1-fx)*(1-fy)+b*fx*(1-fy)+c*(1-fx)*fy+d*fx*fy]; };\n  const lo=1, hi=W-2-1e-3;\n  for(let q=0;q<droplets;q++){\n    let x=lo+r()*(hi-lo), y=lo+r()*(hi-lo), dx=0, dy=0, sp=1, wat=1, sed=0;\n    for(let t=0;t<life;t++){\n      const ix=x|0, iy=y|0, fx=x-ix, fy=y-iy, k=iy*W+ix; const [gx,gy,hh]=grad(x,y);\n      dx=dx*inertia-gx*(1-inertia); dy=dy*inertia-gy*(1-inertia); const L=Math.hypot(dx,dy); if(L<1e-9) break; dx/=L; dy/=L;\n      x+=dx; y+=dy; if(x<lo||y<lo||x>hi||y>hi) break;\n      flow[k]+=wat*0.02;\n      const nh=grad(x,y)[2], dh=nh-hh;\n      const cap=Math.max(-dh*sp*wat*capacity,minCapacity);\n      if(sed>cap||dh>0){   // deposit\n        const amt=dh>0?Math.min(dh,sed):(sed-cap)*depositRate; sed-=amt;\n        hs[k]+=amt*(1-fx)*(1-fy); hs[k+1]+=amt*fx*(1-fy); hs[k+W]+=amt*(1-fx)*fy; hs[k+W+1]+=amt*fx*fy; dep[k]+=amt;\n      } else {             // erode with brush\n        const amt=Math.min((cap-sed)*erodeRate,-dh);\n        for(let b=0;b<bo.length;b++){ const cx=ix+bo[b][0], cy=iy+bo[b][1]; if(cx<0||cy<0||cx>=W||cy>=W) continue;\n          const kk=cy*W+cx, e=Math.min(hs[kk],amt*bw[b]); hs[kk]-=e; sed+=e; }\n      }\n      sp=Math.sqrt(Math.max(0,sp*sp+dh*gravity)); wat*=1-evaporate;\n    }\n  }\n  for(let i=0;i<n;i++) h[i]=hs[i]/S;\n  // blur flow a little for shading\n  const f2=new Float32Array(n); for(let y=1;y<W-1;y++) for(let x=1;x<W-1;x++){ const k=y*W+x; f2[k]=(flow[k]*4+flow[k-1]+flow[k+1]+flow[k-W]+flow[k+W])/8; }\n  return {flow:f2,dep};\n}\n";

const SIZE=8, $=id=>document.getElementById(id);

// ------------------------------------------------------------ scene
const host=$('view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.9;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; host.append(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,0.01,400); camera.position.set(6.5,4.2,7.5);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,0.35,0); controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=0.15; controls.maxDistance=40;
controls.enableZoom=false;   // zoom handled below: reliable inside embedded frames, and zooms toward the cursor
renderer.domElement.style.touchAction='none';
const _ray=new THREE.Raycaster(), _ndc=new THREE.Vector2();
function zoomBy(factor,cx,cy){   // factor<1 zooms in
  const off=camera.position.clone().sub(controls.target), d=off.length(), nd=THREE.MathUtils.clamp(d*factor,controls.minDistance,controls.maxDistance), k=nd/d;
  if(cx!==undefined&&terrainMesh&&factor<1){   // pull the orbit target toward the terrain point under the cursor
    const r=renderer.domElement.getBoundingClientRect(); _ndc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1); _ray.setFromCamera(_ndc,camera);
    const hit=_ray.intersectObject(terrainMesh,false)[0]; if(hit){ const t=1-k; controls.target.lerp(hit.point,t); camera.position.lerp(hit.point,t); return; } }
  camera.position.copy(controls.target).addScaledVector(off,k);
}
renderer.domElement.addEventListener('wheel',e=>{ e.preventDefault(); zoomBy(Math.exp(THREE.MathUtils.clamp(e.deltaY,-120,120)*0.0015),e.clientX,e.clientY); },{passive:false});
addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('input,select')) return; if(e.key==='+'||e.key==='=') zoomBy(0.85); if(e.key==='-'||e.key==='_') zoomBy(1/0.85); });
// pinch zoom
const _pts=new Map(); let _pinch=0;
renderer.domElement.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') _pts.set(e.pointerId,[e.clientX,e.clientY]); });
renderer.domElement.addEventListener('pointermove',e=>{ if(!_pts.has(e.pointerId)) return; _pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(_pts.size===2){ const [a,b]=[..._pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(_pinch) zoomBy(_pinch/d); _pinch=d; } });
for(const ev of ['pointerup','pointercancel']) renderer.domElement.addEventListener(ev,e=>{ _pts.delete(e.pointerId); if(_pts.size<2) _pinch=0; });

const sky=new Sky(); sky.scale.setScalar(300); scene.add(sky);
Object.assign(sky.material.uniforms,{}); const SU=sky.material.uniforms;
SU.turbidity.value=5.5; SU.rayleigh.value=1.6; SU.mieCoefficient.value=0.004; SU.mieDirectionalG.value=0.82;
const pmrem=new THREE.PMREMGenerator(renderer); let envRT=null; const skyScene=new THREE.Scene(); const sky2=new Sky(); sky2.scale.setScalar(300); skyScene.add(sky2);
scene.fog=new THREE.FogExp2(0xaab6bd,0.03);

const sun=new THREE.DirectionalLight(0xfff1dd,3.2); sun.castShadow=true; sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-6.5,right:6.5,top:6.5,bottom:-6.5,near:0.5,far:40}); sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun,sun.target); const hemi=new THREE.HemisphereLight(0xbfd0e0,0x3a3a2c,0.35); scene.add(hemi);

const terrainMat=createTerrainMaterial(THREE,{});
const MU=terrainMat.userData.uniforms;
let terrainMesh=null;

// water: mirror reflections, depth-aware colour and shoreline foam (depth from the tile's height texture)
const water=createWater(THREE,Reflector,{size:SIZE,origin:[-SIZE/2,-SIZE/2],res:256,level:DEFAULT_MATERIAL.waterLevel});
const WU=water.userData.uniforms; scene.add(water);

// ------------------------------------------------------------ controls
const T={...DEFAULT_TERRAIN}, M={...DEFAULT_MATERIAL}, WP={...DEFAULT_WATER}, S={sunElev:24,sunAzim:215,fog:0.03,droplets:40000};
const defs={
  'fs-shape':[
    ['coverage','Mountain coverage',0,1,0.01,T],['mountainHeight','Peak height (km)',0.2,2.5,0.01,T],['ridgeScale','Ridge frequency',0.1,0.8,0.01,T],
    ['sharpness','Crest sharpness',1,3.5,0.05,T],['ridgeGain','Ridge detail',0.8,3,0.05,T],['warp','Warp',0,2,0.01,T],['maskScale','Range size',0.04,0.3,0.005,T]],
  'fs-erosion':[
    ['erosionDamping','Slope smoothing',0,2,0.01,T],['gullyStrength','Gully depth',0,2.5,0.01,T],['gullyScale','Gully frequency',1,8,0.1,T],
    ['gullySlope','Gully steering',0.5,6,0.1,T],['droplets','Hydraulic droplets',0,150000,5000,S]],
  'fs-surface':[
    ['rockSlope','Rock starts at slope',0.2,0.9,0.01,M,'uRockSlope'],['rockSoftness','Rock blend width',0.02,0.4,0.01,M,'uRockSoft'],
    ['snowLine','Snow line (km)',0.2,2.5,0.01,M,'uSnowLine'],['snowFade','Snow fade',0.02,0.6,0.01,M,'uSnowFade'],
    ['detail','Surface detail',0,2,0.01,M,'uDetail'],['strata','Rock strata',0,1,0.01,M,'uStrata']],
  'fs-light':[
    ['sunElev','Sun elevation (°)',2,80,1,S],['sunAzim','Sun direction (°)',0,360,1,S],['waterLevel','Water level (km)',0,0.6,0.002,M,'uWater'],['fog','Haze',0,0.08,0.001,S]],
  'fs-water':[
    ['clarity','Murkiness',10,200,1,WP,'uClarity',WU],['foamWidth','Foam band (km)',0.002,0.04,0.001,WP,'uFoamW',WU],['foam','Foam amount',0,2,0.01,WP,'uFoam',WU],
    ['waveStrength','Wave strength',0,0.8,0.01,WP,'uWaveStr',WU],['waveScale','Wave size',10,120,1,WP,'uWaveScale',WU],['distortion','Reflection ripple',0,0.06,0.001,WP,'uDistort',WU],
    ['wetBand','Wet shore band (km)',0,0.02,0.0005,M,'uWetBand'],['beach','Sandy bank height (km)',0,0.06,0.001,M,'uBeach'],['caustics','Caustics',0,2,0.01,M,'uCaustics']],
};
const REGEN=new Set(['fs-shape','fs-erosion']);
const fmt=(v,st)=>st>=1?Math.round(v).toLocaleString():v.toFixed(st<0.01?3:2);
for(const [fs,list] of Object.entries(defs)) for(const [key,label,min,max,step,obj,uni,uset=MU] of list){
  const id='c-'+key, row=document.createElement('div'); row.className='row';
  row.innerHTML=`<label for="${id}">${label}</label><output id="${id}-o"></output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}">`;
  $(fs).append(row); const inp=row.querySelector('input'), out=row.querySelector('output');
  inp.value=obj[key]; out.textContent=fmt(+obj[key],step);
  inp.addEventListener('input',()=>{ obj[key]=+inp.value; out.textContent=fmt(obj[key],step);
    if(uni) uset[uni].value=obj[key];
    if(REGEN.has(fs)) schedule(); else applyScene(); });
}
$('seed').addEventListener('change',()=>{ T.seed=Math.max(1,parseInt($('seed').value)||1); schedule(0); });
$('reseed').addEventListener('click',()=>{ T.seed=1+Math.floor(Math.random()*99999); $('seed').value=T.seed; schedule(0); });
$('res').addEventListener('change',()=>schedule(0));
$('toggle').addEventListener('click',()=>$('panel').classList.toggle('closed'));

function applyScene(){
  const el=THREE.MathUtils.degToRad(S.sunElev), az=THREE.MathUtils.degToRad(S.sunAzim);
  const d=new THREE.Vector3(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az));
  sun.position.copy(d).multiplyScalar(20); sun.target.position.set(0,0,0);
  SU.sunPosition.value.copy(d); Object.assign(sky2.material.uniforms,{}); for(const k of ['turbidity','rayleigh','mieCoefficient','mieDirectionalG']) sky2.material.uniforms[k].value=SU[k].value;
  sky2.material.uniforms.sunPosition.value.copy(d);
  if(envRT) envRT.dispose(); envRT=pmrem.fromScene(skyScene,0.02); scene.environment=envRT.texture;
  const warm=Math.min(1,S.sunElev/35); sun.color.setRGB(1,0.78+0.2*warm,0.6+0.35*warm); sun.intensity=1.2+2.2*Math.min(1,S.sunElev/20);
  scene.fog.density=S.fog; scene.fog.color.setRGB(0.62+0.08*warm,0.68+0.04*warm,0.72);
  water.userData.setLevel(M.waterLevel); water.visible=M.waterLevel>0.001;
  WU.uSunDir.value.copy(d); WU.uSunColor.value.copy(sun.color).multiplyScalar(sun.intensity/3); WU.uSky.value.copy(scene.fog.color);
}

// ------------------------------------------------------------ generation (worker, main-thread fallback)
let worker=null, busy=false, pending=false, timer=0, idxCache={};
async function makeWorker(){
  try{
    const src=(GEN_SRC||(await (await fetch('./terrain-gen.js')).text()).replace(/^export /gm,''))+`
self.onmessage=e=>{ const {params,res,size,droplets}=e.data, t=performance.now();
  const r=buildTile(createTerrain(params),{res,pointAt:flatPointAt(-size/2,-size/2,size),droplets,dropletSeed:params.seed,cellSize:size/res});
  self.postMessage({positions:r.positions,normals:r.normals,terrain:r.terrain,hmin:r.hmin,hmax:r.hmax,res,ms:performance.now()-t},[r.positions.buffer,r.normals.buffer,r.terrain.buffer]); };`;
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    w.onmessage=e=>done(e.data); w.onerror=()=>{ worker=null; if(busy){ busy=false; generate(); } };
    return w;
  }catch(e){ return null; }
}
function schedule(delay=260){ clearTimeout(timer); timer=setTimeout(generate,delay); }
function generate(){
  if(busy){ pending=true; return; } busy=true; pending=false;
  const res=+$('res').value; $('stat').textContent=`Generating ${res+1} × ${res+1}…`; $('stat').classList.add('busy');
  const msg={params:{...T},res,size:SIZE,droplets:S.droplets};
  if(worker) worker.postMessage(msg);
  else setTimeout(()=>{ const t=performance.now(); const r=buildTile(createTerrain(msg.params),{res,pointAt:flatPointAt(-SIZE/2,-SIZE/2,SIZE),droplets:msg.droplets,dropletSeed:msg.params.seed,cellSize:SIZE/res});
    done({...r,res,ms:performance.now()-t}); },20);
}
function done(r){
  const g=new THREE.BufferGeometry();
  g.setIndex(new THREE.BufferAttribute(idxCache[r.res]||(idxCache[r.res]=gridIndex(r.res)),1));
  g.setAttribute('position',new THREE.BufferAttribute(r.positions,3));
  g.setAttribute('normal',new THREE.BufferAttribute(r.normals,3));
  g.setAttribute('aTerr',new THREE.BufferAttribute(r.terrain,4));
  g.computeBoundingSphere();
  const hs=new Float32Array((r.res+1)**2); for(let i=0;i<hs.length;i++) hs[i]=r.terrain[i*4];
  if(WU.tHeight.value) WU.tHeight.value.dispose(); WU.tHeight.value=makeHeightTexture(THREE,hs,r.res); WU.uRes.value=r.res;
  if(terrainMesh){ terrainMesh.geometry.dispose(); terrainMesh.geometry=g; }
  else { terrainMesh=new THREE.Mesh(g,terrainMat); terrainMesh.castShadow=terrainMesh.receiveShadow=true; scene.add(terrainMesh); }
  const v=(r.res+1)**2;
  $('stat').textContent=`${r.res+1} × ${r.res+1} · ${v.toLocaleString()} vertices · ${Math.round(r.ms)} ms · peak ${r.hmax.toFixed(2)} km`;
  $('stat').classList.remove('busy'); busy=false; if(pending) generate();
}

// ------------------------------------------------------------ loop
function resize(){ const w=host.clientWidth,h=host.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize(); applyScene();
makeWorker().then(w=>{ worker=w; generate(); });
renderer.setAnimationLoop(t=>{ WU.uTime.value=t/1000; MU.uTime.value=t/1000; controls.update(); renderer.render(scene,camera); });
</script>
