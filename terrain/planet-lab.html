<title>Quadsphere Planet Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  color-scheme: dark;
  --ground:#05070a; --panel:rgba(12,16,20,.82); --line:rgba(200,215,225,.12); --line-2:rgba(200,215,225,.26);
  --ink:#e4ebf0; --ink-2:#a3b0ba; --ink-3:#6f7c86; --accent:#8cc6e8; --warn:#e3a45a;
  --ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);overflow:hidden}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:280px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column}
.head{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}
.hud{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink);font-weight:500;text-align:right}
.ctl{display:flex;flex-direction:column;gap:9px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:12px;color:var(--ink-2)}
input[type=number]{font:500 12px var(--mono);color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line-2);padding:5px 7px;width:84px}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:500 13px var(--ui);color:var(--ink);background:transparent;border:1px solid var(--line-2);padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ink-2)} button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--ink-3);line-height:1.45;margin:0}
@media (max-width:640px){ .panel{width:auto;right:12px} .ctl .hint{display:none} }
</style>

<div id="view"></div>
<aside class="panel" aria-label="Planet controls">
  <div class="head"><h1>Quadsphere planet lab</h1></div>
  <div class="hud" id="hud" aria-live="off"></div>
  <div class="ctl">
    <div class="inline"><label for="seed">Seed</label><input type="number" id="seed" value="7" min="1"><button type="button" id="newp">New planet</button></div>
    <label for="lod">Detail distance <span id="lodv"></span></label><input type="range" id="lod" min="1.2" max="4" step="0.1" value="2.2">
    <div class="inline"><button type="button" id="wire" aria-pressed="false">Tile wireframe</button><button type="button" id="home">Back to orbit</button></div>
    <p class="hint">Scroll or pinch to zoom from orbit to the ground. Drag to travel, right-drag (or Q/E, R/F) to turn and tilt, WASD to move.</p>
  </div>
</aside>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
const {createTerrain, buildTile, gridIndex, DEFAULT_TERRAIN}=(()=>{
// Terrain generator — pure JS, no dependencies, safe to run in a Web Worker.
//
// Height is a function of a 3D point and its local "up" direction, so the same code drives
// a flat test tile now (up = +Y) and quad-sphere planet tiles later (up = normalize(p)).
// Everything is seeded and deterministic: a tile rebuilt from the same address is identical.
//
// Layers:
//   1. region mask   — where mountain ranges vs. flat valley floors are
//   2. domain warp   — bends ridgelines so they branch instead of lining up on a grid
//   3. ridged multifractal with derivative damping — sharp crests, eroded-looking flanks
//   4. gully filter  — slope-aligned channels running downhill (triplanar, seamless on a sphere)
//   5. droplet erosion (optional, per grid) — hydraulic carving + sediment fans
//
// Units are arbitrary; the lab uses kilometres.

const DEFAULT_TERRAIN = {
  seed: 7,
  mountainHeight: 1.35,   // peak height above the valley floor
  valleyHeight: 0.05,     // relief of the flat areas
  coverage: 0.52,         // 0..1, how much of the land is mountains
  maskScale: 0.11,        // frequency of the mountain/valley regions
  ridgeScale: 0.32,       // base frequency of the ridges
  octaves: 9,
  sharpness: 2.1,         // ridge crest sharpness (1 = rounded, 3 = knife edges)
  ridgeGain: 1.9,         // how much detail follows existing ridges
  erosionDamping: 0.55,   // derivative damping: smooth slopes, detail stays on crests and flats
  warp: 0.75,             // domain warp amount
  warpScale: 0.18,
  gullyStrength: 0.9,     // slope-aligned channel depth
  gullyScale: 3.2,        // channel frequency
  gullySlope: 3.0,        // how strongly slope steers the channels
  gullyOctaves: 5,
  pads: null,             // [{x,y,z,r,fall,h,rough}] flattened settlement areas (same units)
  continents: null,       // {scale, coast, depth, uplift}: oceans + land masses (planet); off for single tiles
};

// ---------------------------------------------------------------- noise
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function makeNoise(seed){
  const r=mulberry(seed*9973+17), perm=new Uint8Array(512), val=new Float32Array(256);
  for(let i=0;i<256;i++){ perm[i]=i; val[i]=r()*2-1; }
  for(let i=255;i>0;i--){ const j=(r()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<256;i++) perm[i+256]=perm[i];
  const H=(x,y,z)=>val[perm[perm[perm[x&255]+(y&255)]+(z&255)]];

  // value noise with analytic derivatives (quintic). out = [value, dx, dy, dz], value in ~[-1,1]
  function noised(x,y,z,out){
    const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z), fx=x-ix, fy=y-iy, fz=z-iz;
    const ux=fx*fx*fx*(fx*(fx*6-15)+10), uy=fy*fy*fy*(fy*(fy*6-15)+10), uz=fz*fz*fz*(fz*(fz*6-15)+10);
    const dux=30*fx*fx*(fx*(fx-2)+1), duy=30*fy*fy*(fy*(fy-2)+1), duz=30*fz*fz*(fz*(fz-2)+1);
    const a=H(ix,iy,iz), b=H(ix+1,iy,iz), c=H(ix,iy+1,iz), d=H(ix+1,iy+1,iz);
    const e=H(ix,iy,iz+1), f=H(ix+1,iy,iz+1), g=H(ix,iy+1,iz+1), h=H(ix+1,iy+1,iz+1);
    const k1=b-a, k2=c-a, k3=e-a, k4=a-b-c+d, k5=a-c-e+g, k6=a-b-e+f, k7=-a+b+c-d+e-f-g+h;
    out[0]=a+k1*ux+k2*uy+k3*uz+k4*ux*uy+k5*uy*uz+k6*uz*ux+k7*ux*uy*uz;
    out[1]=dux*(k1+k4*uy+k6*uz+k7*uy*uz);
    out[2]=duy*(k2+k5*uz+k4*ux+k7*uz*ux);
    out[3]=duz*(k3+k6*ux+k5*uy+k7*ux*uy);
    return out;
  }
  // 2D cell hash for the gully filter
  const hash2=(x,y,o)=>{ const i=perm[perm[x&255]+(y&255)]; o[0]=val[i]*0.5+0.5; o[1]=val[perm[i+37]]*0.5+0.5; return o; };
  return {noised,hash2};
}

// octave rotation (breaks grid alignment between octaves)
const RM=[0.00,0.80,0.60, -0.80,0.36,-0.48, -0.60,-0.48,0.64];

// ---------------------------------------------------------------- terrain
function createTerrain(opts={}){
  const P={...DEFAULT_TERRAIN,...opts};
  const N=makeNoise(P.seed), nd=[0,0,0,0], hc=[0,0];

  // fbm value + world-space gradient. out=[v,gx,gy,gz]
  function fbm(x,y,z,freq,oct,out){
    let m0=freq,m1=0,m2=0,m3=0,m4=freq,m5=0,m6=0,m7=0,m8=freq;   // accumulated matrix M (q = M p)
    let v=0,gx=0,gy=0,gz=0,a=0.5,norm=0;
    for(let i=0;i<oct;i++){
      N.noised(m0*x+m1*y+m2*z, m3*x+m4*y+m5*z, m6*x+m7*y+m8*z, nd);
      v+=a*nd[0]; norm+=a;
      gx+=a*(m0*nd[1]+m3*nd[2]+m6*nd[3]); gy+=a*(m1*nd[1]+m4*nd[2]+m7*nd[3]); gz+=a*(m2*nd[1]+m5*nd[2]+m8*nd[3]);
      const n0=2*(RM[0]*m0+RM[1]*m3+RM[2]*m6), n1=2*(RM[0]*m1+RM[1]*m4+RM[2]*m7), n2=2*(RM[0]*m2+RM[1]*m5+RM[2]*m8);
      const n3=2*(RM[3]*m0+RM[4]*m3+RM[5]*m6), n4=2*(RM[3]*m1+RM[4]*m4+RM[5]*m7), n5=2*(RM[3]*m2+RM[4]*m5+RM[5]*m8);
      const n6=2*(RM[6]*m0+RM[7]*m3+RM[8]*m6), n7=2*(RM[6]*m1+RM[7]*m4+RM[8]*m7), n8=2*(RM[6]*m2+RM[7]*m5+RM[8]*m8);
      m0=n0;m1=n1;m2=n2;m3=n3;m4=n4;m5=n5;m6=n6;m7=n7;m8=n8; a*=0.5;
    }
    out[0]=v/norm; out[1]=gx/norm; out[2]=gy/norm; out[3]=gz/norm; return out;
  }

  // ridged multifractal with derivative damping. returns [h 0..~1, gx, gy, gz]
  function ridged(x,y,z,out){
    let m0=P.ridgeScale,m1=0,m2=0,m3=0,m4=P.ridgeScale,m5=0,m6=0,m7=0,m8=P.ridgeScale;
    let sum=0,a=1,w=1,dx=0,dy=0,dz=0,gx=0,gy=0,gz=0,norm=0;
    for(let i=0;i<P.octaves;i++){
      N.noised(m0*x+m1*y+m2*z, m3*x+m4*y+m5*z, m6*x+m7*y+m8*z, nd);
      const wx=m0*nd[1]+m3*nd[2]+m6*nd[3], wy=m1*nd[1]+m4*nd[2]+m7*nd[3], wz=m2*nd[1]+m5*nd[2]+m8*nd[3];
      const s=nd[0]<0?-1:1, r0=1-Math.abs(nd[0]), r=Math.pow(Math.max(r0,0),P.sharpness);
      const k=-s*P.sharpness*Math.pow(Math.max(r0,1e-4),P.sharpness-1);   // d(ridge)/d(noise)
      const rx=k*wx, ry=k*wy, rz=k*wz;
      // damping: detail is suppressed where the accumulated slope is steep (flanks stay clean, crests stay busy)
      const damp=1/(1+P.erosionDamping*(dx*dx+dy*dy+dz*dz));
      const c=a*w*r*damp; sum+=c; norm+=a;
      gx+=a*w*damp*rx; gy+=a*w*damp*ry; gz+=a*w*damp*rz;
      dx+=a*rx*w; dy+=a*ry*w; dz+=a*rz*w;
      w=Math.min(1,Math.max(0,r*P.ridgeGain));
      const n0=2*(RM[0]*m0+RM[1]*m3+RM[2]*m6), n1=2*(RM[0]*m1+RM[1]*m4+RM[2]*m7), n2=2*(RM[0]*m2+RM[1]*m5+RM[2]*m8);
      const n3=2*(RM[3]*m0+RM[4]*m3+RM[5]*m6), n4=2*(RM[3]*m1+RM[4]*m4+RM[5]*m7), n5=2*(RM[3]*m2+RM[4]*m5+RM[5]*m8);
      const n6=2*(RM[6]*m0+RM[7]*m3+RM[8]*m6), n7=2*(RM[6]*m1+RM[7]*m4+RM[8]*m7), n8=2*(RM[6]*m2+RM[7]*m5+RM[8]*m8);
      m0=n0;m1=n1;m2=n2;m3=n3;m4=n4;m5=n5;m6=n6;m7=n7;m8=n8; a*=0.5;
    }
    out[0]=sum/norm; out[1]=gx/norm; out[2]=gy/norm; out[3]=gz/norm; return out;
  }

  // gully filter (after clayjohn's "eroded terrain noise"): slope-aligned cosine stripes in a
  // jittered cell grid. (u,v) are plane coords, (ga,gb) the height gradient in that plane.
  const TAU=Math.PI*2;
  function erosionCell(u,v,dirx,diry,o){
    const iu=Math.floor(u), iv=Math.floor(v), fu=u-iu, fv=v-iv; let va=0,vb=0,vc=0,wt=0;
    for(let i=-2;i<=1;i++) for(let j=-2;j<=1;j++){
      N.hash2(iu-i,iv-j,hc); const pu=fu+i-hc[0]*0.5, pv=fv+j-hc[1]*0.5;
      const w=Math.exp(-(pu*pu+pv*pv)*2); wt+=w; const mag=(pu*dirx+pv*diry)*TAU;
      va+=Math.cos(mag)*w; const sn=-Math.sin(mag)*w; vb+=sn*dirx; vc+=sn*diry;
    }
    o[0]=va/wt; o[1]=vb/wt; o[2]=vc/wt; return o;
  }
  const eo=[0,0,0];
  function gullyPlane(u,v,ga,gb){
    let hx=0,hy=0,hz=0,a=0.5,f=1;
    const bx=gb*P.gullySlope, by=-ga*P.gullySlope;      // gradient rotated 90° → stripes run downhill
    for(let i=0;i<P.gullyOctaves;i++){
      erosionCell(u*P.gullyScale*f, v*P.gullyScale*f, bx+hz, by-hy, eo);
      hx+=eo[0]*a; hy+=eo[1]*a*f; hz+=eo[2]*a*f; a*=0.4; f*=2;
    }
    return hx;   // ~[-1,1]: negative = channel, positive = spur
  }

  const t4=[0,0,0,0], w1=[0,0,0,0], w2=[0,0,0,0], w3=[0,0,0,0], rg=[0,0,0,0], vl=[0,0,0,0];
  // Height at 3D point p with local up u. out = {h, gully, mountain}
  function sample(px,py,pz,ux,uy,uz,out){
    // 1. regions
    fbm(px+31.7,py-12.3,pz+5.1,P.maskScale,4,t4);
    const m0=t4[0]*0.5+0.5, lo=P.coverage-0.12, hi=P.coverage+0.12;
    let mt=Math.min(1,Math.max(0,(m0-(1-hi))/((1-lo)-(1-hi)))); mt=mt*mt*(3-2*mt);
    // 2. warp
    fbm(px,py,pz,P.warpScale,3,w1); fbm(px+17.1,py+3.3,pz-9.2,P.warpScale,3,w2); fbm(px-5.7,py+11.9,pz+23.4,P.warpScale,3,w3);
    const qx=px+P.warp*w1[0], qy=py+P.warp*w2[0], qz=pz+P.warp*w3[0];
    // 3. ridges (+ gentle valley floor)
    ridged(qx,qy,qz,rg); fbm(px-40,py+2,pz+11,0.9,4,vl);
    let mh=P.mountainHeight*mt; const vh=P.valleyHeight;
    let h=vh*(vl[0]*0.5+0.5)+mh*rg[0]*rg[0]*1.6;        // squaring keeps valley floors flat, lifts peaks
    const gs=mh*rg[0]*3.2, gx=gs*rg[1]+vh*0.5*vl[1], gy=gs*rg[2]+vh*0.5*vl[2], gz=gs*rg[3]+vh*0.5*vl[3];
    // 4. gullies — gradient projected onto the tangent plane, triplanar-blended by up (seamless on a sphere)
    const gd=gx*ux+gy*uy+gz*uz, tx=gx-ux*gd, ty=gy-uy*gd, tz=gz-uz*gd, slope=Math.hypot(tx,ty,tz);
    let gully=0;
    if(P.gullyStrength>0&&mh>1e-4){
      let ax=ux*ux*ux*ux, ay=uy*uy*uy*uy, az=uz*uz*uz*uz; const s=ax+ay+az; ax/=s; ay/=s; az/=s;
      if(ay>0.01) gully+=ay*gullyPlane(px,pz,tx,tz);
      if(ax>0.01) gully+=ax*gullyPlane(pz,py,tz,ty);
      if(az>0.01) gully+=az*gullyPlane(px,py,tx,ty);
      const sm=Math.min(1,slope/0.9);                 // only on slopes
      h+=gully*P.gullyStrength*0.06*mh*sm*(0.35+0.65*rg[0]);
      gully*=sm;
    }
    // continents: very large-scale noise decides land vs ocean; mountains only on land, shelves slope into the deep
    if(P.continents){ const C=P.continents; fbm(px+101.3,py-57.1,pz+33.7,C.scale,5,t4); const c=t4[0]-C.coast;
      let land=Math.min(1,Math.max(0,(c+0.03)/0.12)); land=land*land*(3-2*land);
      h=h*land+(c>0?c*C.uplift:c*C.depth); gully*=land; mt*=land; }
    // 5. settlement pads: flatten an area (towns, arenas) and blend it into the surroundings
    if(P.pads) for(let i=0;i<P.pads.length;i++){ const pd=P.pads[i], d=Math.hypot(px-pd.x,py-(pd.y||0),pz-pd.z);
      if(d<pd.r+pd.fall){ let w=Math.min(1,Math.max(0,1-(d-pd.r)/pd.fall)); w=w*w*(3-2*w);
        h+=(pd.h+(pd.rough||0)*vl[0]-h)*w; gully*=1-w; mt*=1-w; } }
    out.h=h; out.gully=gully; out.mountain=mt; return out;
  }
  return {params:P, sample};
}

// ---------------------------------------------------------------- tile grid
// Builds one tile. pointAt(u,v,out) maps tile coords (0..1, margin may go outside) to a base
// point {x,y,z} and unit up {ux,uy,uz}; the surface point is base + up*h.
// Flat tile:  base = (x0+u*size, 0, z0+v*size), up = +Y.
// Planet tile: base = cubeToSphere(face,u,v)*R, up = normalize(base).
function buildTile(terrain, {res=256, pointAt, droplets=0, dropletSeed=1, cellSize=1}){
  const M=4, W=res+1+2*M, n=W*W;                         // margin for normals, cavity, erosion
  const bx=new Float32Array(n), by=new Float32Array(n), bz=new Float32Array(n), ux=new Float32Array(n), uy=new Float32Array(n), uz=new Float32Array(n);
  const h=new Float32Array(n), gully=new Float32Array(n), mount=new Float32Array(n), pt={x:0,y:0,z:0,ux:0,uy:1,uz:0}, s={};
  for(let j=0;j<W;j++) for(let i=0;i<W;i++){
    const k=j*W+i; pointAt((i-M)/res,(j-M)/res,pt);
    bx[k]=pt.x; by[k]=pt.y; bz[k]=pt.z; ux[k]=pt.ux; uy[k]=pt.uy; uz[k]=pt.uz;
    terrain.sample(pt.x,pt.y,pt.z,pt.ux,pt.uy,pt.uz,s); h[k]=s.h; gully[k]=s.gully; mount[k]=s.mountain;
  }
  let flow=new Float32Array(n), dep=new Float32Array(n); const h0=droplets>0?h.slice():null;
  if(droplets>0) ({flow,dep}=erodeDroplets(h,W,{droplets,seed:dropletSeed,cellSize,margin:M}));

  // outputs (interior only)
  const V=(res+1)*(res+1), pos=new Float32Array(V*3), nor=new Float32Array(V*3), terr=new Float32Array(V*4), delta=h0?new Float32Array(V):null;
  const X=k=>bx[k]+ux[k]*h[k], Y=k=>by[k]+uy[k]*h[k], Z=k=>bz[k]+uz[k]*h[k];
  let hmin=1e9,hmax=-1e9;
  for(let j=0;j<=res;j++) for(let i=0;i<=res;i++){
    const k=(j+M)*W+(i+M), o=j*(res+1)+i;
    pos[o*3]=X(k); pos[o*3+1]=Y(k); pos[o*3+2]=Z(k);
    // normal from neighbours (works for flat and curved tiles)
    const l=k-1, r=k+1, d=k-W, u=k+W;
    const ax=X(r)-X(l), ay=Y(r)-Y(l), az=Z(r)-Z(l), cx=X(u)-X(d), cy=Y(u)-Y(d), cz=Z(u)-Z(d);
    let nx=cy*az-cz*ay, ny=cz*ax-cx*az, nz=cx*ay-cy*ax; const L=Math.hypot(nx,ny,nz)||1;
    if(nx*ux[k]+ny*uy[k]+nz*uz[k]<0) { nx=-nx; ny=-ny; nz=-nz; }
    nor[o*3]=nx/L; nor[o*3+1]=ny/L; nor[o*3+2]=nz/L;
    // cavity: + in creases/valleys, - on crests (in height units per cell)
    const cav=(h[l]+h[r]+h[d]+h[u]+0.5*(h[d-1]+h[d+1]+h[u-1]+h[u+1]))/6-h[k];
    terr[o*4]=h[k]; terr[o*4+1]=gully[k]; terr[o*4+2]=cav/cellSize; terr[o*4+3]=Math.min(1,flow[k]*0.05+dep[k]*15)*(droplets>0?1:0);
    if(delta) delta[o]=h[k]-h0[k];
    if(h[k]<hmin) hmin=h[k]; if(h[k]>hmax) hmax=h[k];
  }
  // delta: erosion change per vertex (null without droplets) — lets a finer patch inherit the same carving
  return {res,positions:pos,normals:nor,terrain:terr,hmin,hmax,mountain:mount,delta};
}

function flatPointAt(x0,z0,size){ return (u,v,o)=>{ o.x=x0+u*size; o.y=0; o.z=z0+v*size; o.ux=0; o.uy=1; o.uz=0; return o; }; }

// shared index buffer for a (res+1)^2 grid
function gridIndex(res){
  const idx=new Uint32Array(res*res*6); let t=0;
  for(let j=0;j<res;j++) for(let i=0;i<res;i++){ const a=j*(res+1)+i, b=a+1, c=a+res+1, d=c+1;
    if((i+j)&1){ idx[t++]=a; idx[t++]=c; idx[t++]=b; idx[t++]=b; idx[t++]=c; idx[t++]=d; }
    else { idx[t++]=a; idx[t++]=c; idx[t++]=d; idx[t++]=a; idx[t++]=d; idx[t++]=b; } }

(px,py,pz,ux,uy,uz,out){\n    // 1. regions\n    fbm(px+31.7,py-12.3,pz+5.1,P.maskScale,4,t4);\n    const m0=t4[0]*0.5+0.5, lo=P.coverage-0.12, hi=P.coverage+0.12;\n    let mt=Math.min(1,Math.max(0,(m0-(1-hi))/((1-lo)-(1-hi)))); mt=mt*mt*(3-2*mt);\n    // 2. warp\n    fbm(px,py,pz,P.warpScale,3,w1); fbm(px+17.1,py+3.3,pz-9.2,P.warpScale,3,w2); fbm(px-5.7,py+11.9,pz+23.4,P.warpScale,3,w3);\n    const qx=px+P.warp*w1[0], qy=py+P.warp*w2[0], qz=pz+P.warp*w3[0];\n    // 3. ridges (+ gentle valley floor)\n    ridged(qx,qy,qz,rg); fbm(px-40,py+2,pz+11,0.9,4,vl);\n    let mh=P.mountainHeight*mt; const vh=P.valleyHeight;\n    let h=vh*(vl[0]*0.5+0.5)+mh*rg[0]*rg[0]*1.6;        // squaring keeps valley floors flat, lifts peaks\n    const gs=mh*rg[0]*3.2, gx=gs*rg[1]+vh*0.5*vl[1], gy=gs*rg[2]+vh*0.5*vl[2], gz=gs*rg[3]+vh*0.5*vl[3];\n    // 4. gullies \u2014 gradient projected onto the tangent plane, triplanar-blended by up (seamless on a sphere)\n    const gd=gx*ux+gy*uy+gz*uz, tx=gx-ux*gd, ty=gy-uy*gd, tz=gz-uz*gd, slope=Math.hypot(tx,ty,tz);\n    let gully=0;\n    if(P.gullyStrength>0&&mh>1e-4){\n      let ax=ux*ux*ux*ux, ay=uy*uy*uy*uy, az=uz*uz*uz*uz; const s=ax+ay+az; ax/=s; ay/=s; az/=s;\n      if(ay>0.01) gully+=ay*gullyPlane(px,pz,tx,tz);\n      if(ax>0.01) gully+=ax*gullyPlane(pz,py,tz,ty);\n      if(az>0.01) gully+=az*gullyPlane(px,py,tx,ty);\n      const sm=Math.min(1,slope/0.9);                 // only on slopes\n      h+=gully*P.gullyStrength*0.06*mh*sm*(0.35+0.65*rg[0]);\n      gully*=sm;\n    }\n    // continents: very large-scale noise decides land vs ocean; mountains only on land, shelves slope into the deep\n    if(P.continents){ const C=P.continents; fbm(px+101.3,py-57.1,pz+33.7,C.scale,5,t4); const c=t4[0]-C.coast;\n      let land=Math.min(1,Math.max(0,(c+0.03)/0.12)); land=land*land*(3-2*land);\n      h=h*land+(c>0?c*C.uplift:c*C.depth); gully*=land; mt*=land; }\n    // 5. settlement pads: flatten an area (towns, arenas) and blend it into the surroundings\n    if(P.pads) for(let i=0;i<P.pads.length;i++){ const pd=P.pads[i], d=Math.hypot(px-pd.x,py-(pd.y||0),pz-pd.z);\n      if(d<pd.r+pd.fall){ let w=Math.min(1,Math.max(0,1-(d-pd.r)/pd.fall)); w=w*w*(3-2*w);\n        h+=(pd.h+(pd.rough||0)*vl[0]-h)*w; gully*=1-w; mt*=1-w; } }\n    out.h=h; out.gully=gully; out.mountain=mt; return out;\n  }\n  return {params:P, sample};\n}\n\n// ---------------------------------------------------------------- tile grid\n// Builds one tile. pointAt(u,v,out) maps tile coords (0..1, margin may go outside) to a base\n// point {x,y,z} and unit up {ux,uy,uz}; the surface point is base + up*h.\n// Flat tile:  base = (x0+u*size, 0, z0+v*size), up = +Y.\n// Planet tile: base = cubeToSphere(face,u,v)*R, up = normalize(base).\nfunction buildTile(terrain, {res=256, pointAt, droplets=0, dropletSeed=1, cellSize=1}){\n  const M=4, W=res+1+2*M, n=W*W;                         // margin for normals, cavity, erosion\n  const bx=new Float32Array(n), by=new Float32Array(n), bz=new Float32Array(n), ux=new Float32Array(n), uy=new Float32Array(n), uz=new Float32Array(n);\n  const h=new Float32Array(n), gully=new Float32Array(n), mount=new Float32Array(n), pt={x:0,y:0,z:0,ux:0,uy:1,uz:0}, s={};\n  for(let j=0;j<W;j++) for(let i=0;i<W;i++){\n    const k=j*W+i; pointAt((i-M)/res,(j-M)/res,pt);\n    bx[k]=pt.x; by[k]=pt.y; bz[k]=pt.z; ux[k]=pt.ux; uy[k]=pt.uy; uz[k]=pt.uz;\n    terrain.sample(pt.x,pt.y,pt.z,pt.ux,pt.uy,pt.uz,s); h[k]=s.h; gully[k]=s.gully; mount[k]=s.mountain;\n  }\n  let flow=new Float32Array(n), dep=new Float32Array(n); const h0=droplets>0?h.slice():null;\n  if(droplets>0) ({flow,dep}=erodeDroplets(h,W,{droplets,seed:dropletSeed,cellSize,margin:M}));\n\n  // outputs (interior only)\n  const V=(res+1)*(res+1), pos=new Float32Array(V*3), nor=new Float32Array(V*3), terr=new Float32Array(V*4), delta=h0?new Float32Array(V):null;\n  const X=k=>bx[k]+ux[k]*h[k], Y=k=>by[k]+uy[k]*h[k], Z=k=>bz[k]+uz[k]*h[k];\n  let hmin=1e9,hmax=-1e9;\n  for(let j=0;j<=res;j++) for(let i=0;i<=res;i++){\n    const k=(j+M)*W+(i+M), o=j*(res+1)+i;\n    pos[o*3]=X(k); pos[o*3+1]=Y(k); pos[o*3+2]=Z(k);\n    // normal from neighbours (works for flat and curved tiles)\n    const l=k-1, r=k+1, d=k-W, u=k+W;\n    const ax=X(r)-X(l), ay=Y(r)-Y(l), az=Z(r)-Z(l), cx=X(u)-X(d), cy=Y(u)-Y(d), cz=Z(u)-Z(d);\n    let nx=cy*az-cz*ay, ny=cz*ax-cx*az, nz=cx*ay-cy*ax; const L=Math.hypot(nx,ny,nz)||1;\n    if(nx*ux[k]+ny*uy[k]+nz*uz[k]<0) { nx=-nx; ny=-ny; nz=-nz; }\n    nor[o*3]=nx/L; nor[o*3+1]=ny/L; nor[o*3+2]=nz/L;\n    // cavity: + in creases/valleys, - on crests (in height units per cell)\n    const cav=(h[l]+h[r]+h[d]+h[u]+0.5*(h[d-1]+h[d+1]+h[u-1]+h[u+1]))/6-h[k];\n    terr[o*4]=h[k]; terr[o*4+1]=gully[k]; terr[o*4+2]=cav/cellSize; terr[o*4+3]=Math.min(1,flow[k]*0.05+dep[k]*15)*(droplets>0?1:0);\n    if(delta) delta[o]=h[k]-h0[k];\n    if(h[k]<hmin) hmin=h[k]; if(h[k]>hmax) hmax=h[k];\n  }\n  // delta: erosion change per vertex (null without droplets) \u2014 lets a finer patch inherit the same carving\n  return {res,positions:pos,normals:nor,terrain:terr,hmin,hmax,mountain:mount,delta};\n}\n\nfunction flatPointAt(x0,z0,size){ return (u,v,o)=>{ o.x=x0+u*size; o.y=0; o.z=z0+v*size; o.ux=0; o.uy=1; o.uz=0; return o; }; }\n\n// shared index buffer for a (res+1)^2 grid\nfunction gridIndex(res){\n  const idx=new Uint32Array(res*res*6); let t=0;\n  for(let j=0;j<res;j++) for(let i=0;i<res;i++){ const a=j*(res+1)+i, b=a+1, c=a+res+1, d=c+1;\n    if((i+j)&1){ idx[t++]=a; idx[t++]=c; idx[t++]=b; idx[t++]=b; idx[t++]=c; idx[t++]=d; }\n    else { idx[t++]=a; idx[t++]=c; idx[t++]=d; idx[t++]=a; idx[t++]=d; idx[t++]=b; } }\n  return idx;\n}\n\n// ---------------------------------------------------------------- hydraulic droplet erosion\n// Particle erosion on a square height grid (after Hans Beyer / Sebastian Lague). Modifies h in place.\n// Returns per-cell flow (how much water passed) and deposition, which the material uses.\n// For the planet this runs );\n        for(let b=0;b<bo.length;b++){ const cx=ix+bo[b][0], cy=iy+bo[b][1]; if(cx<0||cy<0||cx>=W||cy>=W) continue;\n          const kk=cy*W+cx, e=Math.min(hs[kk],amt*bw[b]); hs[kk]-=e; sed+=e; }\n      }\n      sp=Math.sqrt(Math.max(0,sp*sp+dh*gravity)); wat*=1-evaporate;\n    }\n  }\n  for(let i=0;i<n;i++) h[i]=hs[i]/S;\n  // blur flow a little for shading\n  const f2=new Float32Array(n); for(let y=1;y<W-1;y++) for(let x=1;x<W-1;x++){ const k=y*W+x; f2[k]=(flow[k]*4+flow[k-1]+flow[k+1]+flow[k-W]+flow[k+W])/8; }\n  return {flow:f2,dep};\n}\n\n// ---------------------------------------------------------------- baked sun visibility\n// Soft terrain self-shadowing for a flat tile: for each vertex, march toward the sun over the height\n// grid and measure how far the terrain rises above the ray. Returns 0 (shadowed) .. 1 (lit).\n// heights: (res+1)^2 grid over `size` (same units as heights); sun: unit vector toward the sun (x,y,z).\nfunction bakeSunVisibility(heights,res,size,sun,{maxDist=size*0.6,softness=0.04}={}){\n  const R=res+1, cell=size/res, out=new Float32Array(R*R), hl=Math.hypot(sun[0],sun[2])||1e-6;\n  const dx=sun[0]/hl, dz=sun[2]/hl, rise=sun[1]/hl, steps=Math.ceil(maxDist/cell);\n  const Hs=(x,z)=>{ if(x<0||z<0||x>res||z>res) return -1e9; const i=Math.min(res-1,x|0), j=Math.min(res-1,z|0), fx=x-i, fz=z-j;\n    return (heights[j*R+i]*(1-fx)+heights[j*R+i+1]*fx)*(1-fz)+(heights[(j+1)*R+i]*(1-fx)+heights[(j+1)*R+i+1]*fx)*fz; };\n  for(let j=0;j<R;j++) for(let i=0;i<R;i++){ const h0=heights[j*R+i]; let vis=1;\n    for(let s=1;s<=steps;s++){ const t=s*cell*(1+s*0.01), x=i+dx*t/cell, z=j+dz*t/cell, ht=Hs(x,z); if(ht<-1e8) break;\n      const clear=h0+t*rise-ht; if(clear<0){ vis=0; break; } vis=Math.min(vis,clear/(t*softness)); if(h0+t*rise>1e3) break; }\n    out[j*R+i]=Math.max(0,Math.min(1,vis)); }\n  return out;\n}\n", CUBE_SRC="// Cube-sphere math for planet tiles \u2014 pure JS, safe in workers.\n// Tile address: face 0..5, level L (0 = whole face), x,y in [0, 2^L). Face coords a,b \u2208 [-1,1].\n// Faces are set up so that U\u00d7V = \u2212N: the shared grid index (terrain-gen gridIndex) then winds\n// counter-clockwise seen from outside on every face.\nconst FACES=[\n  {n:[ 1,0,0],u:[0,0, 1],v:[0,1,0]}, {n:[-1,0,0],u:[0,0,-1],v:[0,1,0]},\n  {n:[0, 1,0],u:[1,0,0],v:[0,0, 1]}, {n:[0,-1,0],u:[1,0,0],v:[0,0,-1]},\n  {n:[0,0, 1],u:[-1,0,0],v:[0,1,0]}, {n:[0,0,-1],u:[1,0,0],v:[0,1,0]},\n];\n// face coords \u2192 unit direction (spherified cube: near-uniform tile sizes, no pole pinching)\nfunction faceDir(f,a,b,out){\n  const F=FACES[f], x=F.n[0]+a*F.u[0]+b*F.v[0], y=F.n[1]+a*F.u[1]+b*F.v[1], z=F.n[2]+a*F.u[2]+b*F.v[2];\n  const x2=x*x, y2=y*y, z2=z*z;\n  let sx=x*Math.sqrt(Math.max(0,1-y2/2-z2/2+y2*z2/3)), sy=y*Math.sqrt(Math.max(0,1-z2/2-x2/2+z2*x2/3)), sz=z*Math.sqrt(Math.max(0,1-x2/2-y2/2+x2*y2/3));\n  const L=Math.hypot(sx,sy,sz); out[0]=sx/L; out[1]=sy/L; out[2]=sz/L; return out;\n}\n// unit direction \u2192 {f,a,b} (inverse of the plain cube projection; used for anchors/keys)\nfunction dirFace(d){\n  const ax=Math.abs(d[0]), ay=Math.abs(d[1]), az=Math.abs(d[2]); let f;\n  if(ax>=ay&&ax>=az) f=d[0]>0?0:1; else if(ay>=az) f=d[1]>0?2:3; else f=d[2]>0?4:5;\n  const F=FACES[f], k=1/(d[0]*F.n[0]+d[1]*F.n[1]+d[2]*F.n[2]);\n  return {f,a:(d[0]*F.u[0]+d[1]*F.u[1]+d[2]*F.u[2])*k, b:(d[0]*F.v[0]+d[1]*F.v[1]+d[2]*F.v[2])*k};\n}\nconst tileKey=(f,L,x,y)=>f+'/'+L+'/'+x+'/'+y;\n// tile's (u,v)\u2208[0,1] \u2192 face coords\nconst tileAB=(L,x,y,u,v)=>{ const n=1<<L; return [-1+2*(x+u)/n, -1+2*(y+v)/n]; };\n";

const camera=new THREE.PerspectiveCamera(50,1,0.0005,R*8);
const SUN=new THREE.Vector3(0.55,0.35,0.76).normalize();
const sun=new THREE.DirectionalLight(0xfff1dd,3.0); sun.position.copy(SUN).multiplyScalar(R*4); scene.add(sun);
scene.add(new THREE.AmbientLight(0x9fb3c8,0.32));

// atmosphere rim (seen from space) and stars
const atmo=new THREE.Mesh(new THREE.SphereGeometry(R*1.03,96,64),new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.BackSide,blending:THREE.AdditiveBlending,
  uniforms:{uSun:{value:SUN},uAlpha:{value:1}},
  vertexShader:`#include <common>
    #include <logdepthbuf_pars_vertex>
    varying vec3 vN; varying vec3 vV; void main(){ vec4 wp=modelMatrix*vec4(position,1.); vN=normalize(wp.xyz); vV=normalize(wp.xyz-cameraPosition); gl_Position=projectionMatrix*viewMatrix*wp;
    #include <logdepthbuf_vertex>
    }`,
  fragmentShader:`#include <common>
    #include <logdepthbuf_pars_fragment>
    uniform vec3 uSun; uniform float uAlpha; varying vec3 vN; varying vec3 vV; void main(){
    #include <logdepthbuf_fragment>
    float rim=pow(1.-abs(dot(vN,-vV)),2.2); float day=smoothstep(-0.25,0.35,dot(vN,uSun));
    gl_FragColor=vec4(vec3(0.35,0.6,1.0)*rim*(0.15+1.1*day)*uAlpha,1.); }`}));
scene.add(atmo);
const stars=(()=>{ const n=2500, p=new Float32Array(n*3); for(let i=0;i<n;i++){ const u=Math.random()*2-1, a=Math.random()*6.283, s=Math.sqrt(1-u*u); p.set([s*Math.cos(a)*R*6,u*R*6,s*Math.sin(a)*R*6],i*3); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.PointsMaterial({color:0xffffff,size:1.5,sizeAttenuation:false,fog:false,transparent:true}); const pts=new THREE.Points(g,m); scene.add(pts); return pts; })();

// ------------------------------------------------------------ materials
const terrainMat=createTerrainMaterial(THREE,{upMode:1,km:1,waterLevel:0});
const oceanMat=new THREE.MeshStandardMaterial({color:0x0b3040,roughness:0.14,metalness:0,transparent:true,opacity:0.9});
const OU={uTime:{value:0}};
oceanMat.onBeforeCompile=sh=>{ Object.assign(sh.uniforms,OU);
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.)).xyz;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
    varying vec3 vWP; uniform float uTime;
    float oH(vec3 p){ return sin(p.x*1.7+uTime*1.1)*0.5+sin(p.y*2.3-uTime*0.9)*0.5+sin(p.z*2.9+uTime*1.3)*0.4+sin((p.x+p.z)*5.3-uTime*2.1)*0.15; }`)
  .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
    { vec3 p=vWP*40.; float e=0.05, h0=oH(p); vec3 g=vec3(oH(p+vec3(e,0,0))-h0,oH(p+vec3(0,e,0))-h0,oH(p+vec3(0,0,e))-h0)/e;
      vec3 up=normalize(vWP); g-=up*dot(g,up); float fade=1.-smoothstep(2.,30.,length(cameraPosition)-${R.toFixed(1)});
      normal=normalize(normal-(viewMatrix*vec4(g*0.03*fade,0.)).xyz); }`); };

// ------------------------------------------------------------ tiles
const strip=s=>s.replace(/^export /gm,'');
async function workerSource(){
  const gen=GEN_SRC||strip(await (await fetch('./terrain-gen.js')).text()), cube=CUBE_SRC||strip(await (await fetch('./cube-sphere.js')).text());
  return gen+'\n'+cube+'\n'+PLANET_WORKER;
}
let tilesys=null, groundT=createTerrain(planetParams(7));
workerSource().then(src=>{
  tilesys=createPlanetTiles({THREE,gridIndex,faceDir,dirFace,tileKey},{scene,radius:R,res:48,maxLevel:9,workerSrc:src,params:planetParams(+$('seed').value),terrainMaterial:terrainMat,oceanMaterial:oceanMat});
});

// ------------------------------------------------------------ camera: continuous orbit → ground
const cam={lat:0.35,lon:0.6,alt:R*1.6,heading:0,tiltOff:0};
const tmp={}, up=new THREE.Vector3(), east=new THREE.Vector3(), north=new THREE.Vector3(), fwd=new THREE.Vector3();
const dirOf=(lat,lon,out)=>out.set(Math.cos(lat)*Math.cos(lon),Math.sin(lat),Math.cos(lat)*Math.sin(lon));
function groundAt(d){ groundT.sample(d.x*R,d.y*R,d.z*R,d.x,d.y,d.z,tmp); return Math.max(tmp.h,0); }
function placeCamera(){
  dirOf(cam.lat,cam.lon,up); const g=groundAt(up); cam.alt=Math.max(cam.alt,0.03);
  camera.position.copy(up).multiplyScalar(R+g+cam.alt);
  east.set(-Math.sin(cam.lon),0,Math.cos(cam.lon)); north.crossVectors(up,east).normalize();
  // high up: look at the planet; low down: tilt toward the horizon
  const low=1-THREE.MathUtils.smoothstep(cam.alt,1.5,80), pitch=THREE.MathUtils.clamp(-Math.PI/2+low*(Math.PI/2-0.22)+cam.tiltOff,-Math.PI/2,0.35);
  const h=new THREE.Vector3().copy(north).multiplyScalar(Math.cos(cam.heading)).addScaledVector(east,Math.sin(cam.heading));
  fwd.copy(h).multiplyScalar(Math.cos(pitch)).addScaledVector(up,Math.sin(pitch));
  camera.up.copy(pitch<-1.5?h:up); camera.lookAt(camera.position.clone().add(fwd));
  // atmosphere / sky by altitude
  const inAir=1-THREE.MathUtils.smoothstep(cam.alt,4,90);
  scene.background.setRGB(0.56*inAir,0.72*inAir,0.86*inAir); scene.fog.color.copy(scene.background); scene.fog.density=0.02*inAir*inAir;
  stars.material.opacity=THREE.MathUtils.smoothstep(cam.alt,15,120); atmo.material.uniforms.uAlpha.value=1-inAir*0.85;
  camera.near=Math.max(0.0005,cam.alt*0.001); camera.far=R*8; camera.updateProjectionMatrix();
}
{ const el=renderer.domElement; let drag=null; const pts=new Map(); let pinch=0;
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); drag={x:e.clientX,y:e.clientY,b:e.button}; });
  el.addEventListener('pointermove',e=>{ if(!drag) return; if(pts.has(e.pointerId)) pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch) cam.alt*=pinch/d; pinch=d; return; }
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(drag.b===2||e.shiftKey){ cam.heading+=dx*0.005; cam.tiltOff=THREE.MathUtils.clamp(cam.tiltOff-dy*0.004,-1.2,1.2); return; }
    move(-dy,dx,0.0022); });
  const end=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=0; if(!pts.size) drag=null; };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{ e.preventDefault(); cam.alt=THREE.MathUtils.clamp(cam.alt*Math.exp(THREE.MathUtils.clamp(e.deltaY,-150,150)*0.0018),0.03,R*3); },{passive:false});
}
function move(fw,rt,k){ const s=Math.min(cam.alt,R)*k/R;   // angular step scales with altitude
  const ch=Math.cos(cam.heading), sh=Math.sin(cam.heading);
  cam.lat=THREE.MathUtils.clamp(cam.lat+(fw*ch-rt*sh)*s,-1.5,1.5); cam.lon+=(fw*sh+rt*ch)*s/Math.max(0.2,Math.cos(cam.lat)); }
const keys=new Set(); addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('input')) return; keys.add(e.key.toLowerCase()); }); addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

// ------------------------------------------------------------ UI
$('lod').addEventListener('input',()=>{ $('lodv').textContent=(+$('lod').value).toFixed(1)+'×'; });
$('lodv').textContent='2.2×';
$('newp').addEventListener('click',()=>{ const s=Math.max(1,parseInt($('seed').value)||1); groundT=createTerrain(planetParams(s)); tilesys&&tilesys.setParams(planetParams(s)); });
$('wire').addEventListener('click',e=>{ terrainMat.wireframe=!terrainMat.wireframe; e.currentTarget.setAttribute('aria-pressed',terrainMat.wireframe); });
$('home').addEventListener('click',()=>{ cam.alt=R*1.6; cam.tiltOff=0; });
function hud(){ const st=tilesys?tilesys.stats:{};
  const a=cam.alt<1?(cam.alt*1000).toFixed(0)+' m':cam.alt.toFixed(cam.alt<10?2:0)+' km';
  $('hud').innerHTML=`<span>Altitude</span><b>${a}</b><span>Lat / lon</span><b>${(cam.lat*57.3).toFixed(2)}° / ${((cam.lon*57.3)%360).toFixed(2)}°</b>
    <span>Tiles drawn</span><b>${st.drawn??'–'}</b><span>Tiles loaded</span><b>${st.loaded??'–'}</b><span>Building / queued</span><b>${st.building??0} / ${st.queued??0}</b><span>Awaiting upload</span><b>${st.waiting??0}</b>
    <span>Deepest level</span><b>${st.level??0}</b><span>Recomputes</span><b>${st.recomputes??0}</b>`; }

// ------------------------------------------------------------ loop
window.__planet={cam,get tiles(){ return tilesys; }};   // debugging handle
function resize(){ const w=host.clientWidth,h=host.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
let last=performance.now(), hudT=0;
renderer.setAnimationLoop(t=>{ const dt=Math.min(0.05,(t-last)/1000); last=t;
  if(keys.has('w')) move(1,0,dt*300); if(keys.has('s')) move(-1,0,dt*300); if(keys.has('a')) move(0,-1,dt*300); if(keys.has('d')) move(0,1,dt*300);
  if(keys.has('q')) cam.heading-=dt*1.2; if(keys.has('e')) cam.heading+=dt*1.2; if(keys.has('r')) cam.tiltOff=Math.min(1.2,cam.tiltOff+dt); if(keys.has('f')) cam.tiltOff=Math.max(-1.2,cam.tiltOff-dt);
  placeCamera(); OU.uTime.value=t/1000; terrainMat.userData.uniforms.uTime.value=t/1000;
  if(tilesys){ tilesys.setSplitK(+$('lod').value); tilesys.update(camera); }
  if((hudT+=dt)>0.2){ hudT=0; hud(); }
  renderer.render(scene,camera); });
</script>
