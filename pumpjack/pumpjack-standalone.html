<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pumpjack Viewer</title>
<style>
  :root { --bg: #f2f1ee; --panel: rgba(255,255,255,0.88); --ink: #222; --accent: #b4532a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: absolute; top: 12px; left: 12px; background: var(--panel); padding: 12px 14px; border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0,0,0,.12); display: grid; gap: 8px; min-width: 220px; }
  #ui h1 { font-size: 15px; margin: 0 0 2px; }
  #ui label { display: grid; grid-template-columns: 70px 1fr 36px; align-items: center; gap: 6px; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button, select { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  button.danger { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div id="ui">
  <h1>Pumpjack</h1>
  <label>Speed <input id="speed" type="range" min="0" max="3" step="0.05" value="1"><span id="speedV">1.0</span></label>
  <label>Health <input id="health" type="range" min="0" max="1" step="0.01" value="1"><span id="healthV">100</span></label>
  <div class="row">
    <select id="part"></select><button id="break">Break part</button>
  </div>
  <div class="row">
    <button id="destroy" class="danger">Destroy</button>
    <button id="reset">Reset</button>
    <button id="export">Export GLB</button>
  </div>
</div>
