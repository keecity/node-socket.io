<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Animations</title>
<style>
  body { margin: 0; background: #1d1f27; font-family: system-ui, sans-serif; overflow: hidden; }
  #ui, #speed { position: fixed; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  #ui { top: 12px; } #speed { top: 56px; }
  #speed button { padding: 5px 10px; font-size: 12px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #3b3f52; color: #fff; font-size: 14px; cursor: pointer; }
  button.on { background: #e8701a; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="ui"></div>
<div id="speed"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// The Shoot and Dunk clips are authored against a rim centred at (0, 1.35, 1.8).
const RIM = new THREE.Vector3(0, 1.35, 1.8);
const HOOP_RIM_LOCAL = new THREE.Vector3(0.006, 0.625, 0.43); // rim centre in the hoop model
const HOOP_SCALE = RIM.y / HOOP_RIM_LOCAL.y;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1d1f27);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 50);
camera.position.set(-1.55, 1.6, -2.45);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.75, 0.75); controls.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(2, 4, 1); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0xb07a45 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const loader = new GLTFLoader();
loader.load('models/basketball_hoop.glb', (g) => {
  const hoop = g.scene; hoop.scale.setScalar(HOOP_SCALE); hoop.rotation.y = Math.PI; // rim faces the player
  const r = HOOP_RIM_LOCAL.clone().multiplyScalar(HOOP_SCALE).applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
  hoop.position.copy(RIM).sub(r); hoop.position.y = 0;
  scene.add(hoop);
});

let mixer, current;
loader.load('models/player_rigged.glb', (g) => {
  g.scene.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  scene.add(g.scene);
  mixer = new THREE.AnimationMixer(g.scene);
  const actions = {};
  const ui = document.getElementById('ui');
  for (const clip of g.animations) {
    const a = mixer.clipAction(clip);
    if (clip.name === 'Shoot' || clip.name === 'Dunk') { a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; }
    actions[clip.name] = a;
    const b = document.createElement('button'); b.textContent = clip.name; b.onclick = () => play(clip.name); ui.appendChild(b);
  }
  const play = (name) => {
    const next = actions[name];
    if (current && current !== next) current.fadeOut(0.15);
    next.reset().fadeIn(0.15).play(); current = next;
    for (const b of ui.children) b.classList.toggle('on', b.textContent === name);
  };
  // one-shot clips fall back to idle when done
  mixer.addEventListener('finished', () => setTimeout(() => play('Idle'), 400));
  const sp = document.getElementById('speed');
  for (const v of [1, 0.5, 0.25]) {
    const b = document.createElement('button'); b.textContent = v + 'x';
    b.onclick = () => { mixer.timeScale = v; for (const x of sp.children) x.classList.toggle('on', x === b); };
    if (v === 1) b.classList.add('on'); sp.appendChild(b);
  }
  const q = new URLSearchParams(location.search);
  play(q.get('clip') || 'Idle');
  if (q.has('t')) {   // freeze on a given time, for reviewing a single frame
    current.fadeIn(0); mixer.update(0); current.time = parseFloat(q.get('t')); current.paused = true; mixer.update(0);
    window.__frozen = true;
  }
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { mixer?.update(clock.getDelta()); renderer.render(scene, camera); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
